tagline: He set out as a ship’s master and came home captain of the first vessel to sail around the world.
hook: >-
  By December 1521 the expedition’s commander was dead and its leadership had collapsed. In command
  of the Victoria, Elcano chose the most dangerous road home — west, through waters controlled by
  Portugal — and in doing so closed the first recorded circle around the world.
mainAchievement: Completed the first recorded circumnavigation, 1522
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Juan Sebastián Elcano was born in 1487 in Getaria, on the Basque coast. By 1519 he was an
      experienced mariner, and he joined the fleet Ferdinand Magellan was leading towards the
      Moluccas, the Spice Islands. He did not command it. He sailed as master of the Concepción —
      the officer responsible for running the ship under its captain — one seaman in a crew drawn
      from many nations.
    sources: [research-dossier]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      The fleet found its strait and crossed the Pacific. Then, in 1521, Magellan was killed at
      Mactan, and the expedition’s leadership fell apart in a sequence of command changes. Out of
      that turmoil Elcano — a master, not a captain — emerged in command of the Victoria, half a
      world away from home.
    sources: [research-dossier]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      By December 1521 Elcano was effectively leading the attempt to get home. He could have turned
      back across the Pacific. Instead he chose the western route: across the Indian Ocean, around
      the Cape of Good Hope and north to Spain — through waters controlled by Portugal, Spain’s
      rival. It was the more dangerous road, and the only one that would complete the circle.
    sources: [research-dossier]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      On 6 September 1522 the battered Victoria reached Sanlúcar, at the mouth of the Guadalquivir.
      Its surviving crew had completed the first recorded circumnavigation of the Earth. Elcano wrote
      to the emperor Charles V straight away, setting out what they had achieved: they had found the
      strait, reached the Moluccas and sailed all the way around the globe.
    sources: [research-dossier, elcano-letter-1522]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      The voyage showed that a ship could complete a practicable oceanic circuit of the world, and it
      transformed European geographical knowledge. Elcano went to sea again as pilot major of the
      Loaísa expedition and died in the Pacific on 4 August 1526. His own letter makes his role
      unusually tangible — but the achievement belonged to many, beginning with Magellan.
    more: >-
      Few figures of the age left such direct testimony. Elcano’s letter of 6 September 1522 and his
      1526 testament both survive in the Archivo General de Indias in Seville, alongside the payroll
      and expedition records of the Casa de la Contratación. Getaria and Spain’s naval collections
      keep commemorative material about him.
    sources: [research-dossier, elcano-letter-1522, elcano-testament-1526]
    status: verified

