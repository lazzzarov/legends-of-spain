myths:
  - claim: Elcano planned the first voyage around the world.
    status: legend
    explanation: >-
      Magellan conceived the expedition and commanded most of it. Elcano completed it after
      Magellan’s death. A fair account gives both men distinct credit.
    sources: [research-dossier]

otherSide:
  body: >-
    Spanish and Portuguese national narratives have each turned this multinational expedition into
    a story of their own hero. The voyage depended on dozens of European, Asian and African sailors
    whose labour made it possible — and many of them never came home.
  sources: [research-dossier]

