tagline: He set out as a ship’s master and came home captain of the first vessel to sail around the world.
hook: >-
  In December 1521, at Tidore in the Moluccas, the Trinidad was leaking and a Portuguese fleet was
  said to be on its way. The two captains split the expedition. Elcano would take the Victoria west,
  by the Portuguese route, without calling at any port. Sixty men went aboard. Eighteen of them came
  home.
mainAchievement: Captained the Victoria home to complete the first recorded circumnavigation, 1522
keyEvent:
  year: 1522
  label: The Victoria returns to Sanlúcar
  sources: [rah-elcano, pigafetta-stanley]
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Elcano was born in Getaria, on the Basque coast. His baptism record is lost, but a 1519
      document says he was thirty-two. He grew up in a seafaring family and came to own a ship of
      two hundred tons, which served the Crown in Africa and Italy. Unpaid, he borrowed money from
      foreign merchants and had to hand the ship over to them. That was a crime. By 1518 he was in
      Seville with his name under a cloud.
    sources: [rah-elcano]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      Even so, he was signed on as master of the Concepción, the officer who ran the ship under its
      captain, in the five-ship fleet that Ferdinand Magellan led out of Seville in August 1519. At
      San Julián he was drawn into the mutiny against Magellan and was pardoned. Then, in April 1521,
      Magellan was killed on Mactan. After a run of command changes, the Concepción was destroyed and
      Elcano ended up captain of the Victoria.
    sources: [rah-elcano, pigafetta-stanley]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      The Victoria left Tidore on 21 December 1521. From Timor she crossed the Indian Ocean without
      stopping, keeping clear of Portuguese India. For about nine weeks westerly gales held her off
      the Cape of Good Hope. Scurvy spread and the ship leaked. Crewmen begged Elcano to put in at
      Portuguese Mozambique, and he refused. On 6 May 1522 she rounded the Cape, about five leagues
      offshore.
    sources: [rah-elcano, pigafetta-stanley]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      Starving, the crew put in at Portuguese Cape Verde and claimed to be coming from America. There
      they found that their calendar was a day behind: they had sailed westward with the sun all the
      way round. When the Portuguese saw through the story and seized the boat’s crew, Elcano cut the
      anchor cable and ran for home. On 6 September 1522 the Victoria reached Sanlúcar with eighteen
      men.
    sources: [rah-elcano, pigafetta-stanley]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Elcano wrote to Charles V from Sanlúcar the day the ship arrived. The letter reported the
      strait, the spices of the Moluccas and the fact that they had sailed right round the world,
      and it asked for rewards for the survivors. The emperor granted him a coat of arms with a globe
      and a yearly pension of 500 ducats. He went back to sea with Loaísa’s fleet and died in the
      Pacific in August 1526.
    more: >-
      The Victoria was towed up the Guadalquivir and moored at Seville on 8 September. The next day
      the survivors walked barefoot, carrying candles, to the shrine of Santa María de la Victoria.
      The Archivo General de Indias keeps a copy of Elcano’s letter and the papers on his estate,
      among them the will he made aboard the Victoria on 26 July 1526. They show that his mother was
      still suing the Crown for his unpaid pension years after he died. The sources disagree on the
      exact day of his death: the Real Academia de la Historia gives 6 August, and other accounts
      give 4 August.
    sources: [rah-elcano, elcano-letter-1522, elcano-testament-1526, pigafetta-stanley]
    status: verified

facts:
  - value: 234–285
    label: Crew who sailed in 1519
    explanation: >-
      Counts vary. The 1518 royal agreement allowed 234 people, a contemporary report gave about
      230, and later historians give 265, 270 or 285.
    sources: [pigafetta-stanley, rah-elcano, real-instituto-elcano]
    status: disputed
  - value: '60'
    label: Aboard the Victoria leaving the Moluccas
    explanation: >-
      Pigafetta counts sixty. The Real Academia de la Historia gives forty-seven expedition members
      and thirteen Asian men it describes as enslaved.
    sources: [pigafetta-stanley, rah-elcano]
    status: verified
  - value: '18'
    label: Men who reached Sanlúcar on the Victoria
    explanation: >-
      On 6 September 1522, most of them sick. Others had died, deserted at Timor, been executed or
      been left behind under arrest at Cape Verde.
    sources: [pigafetta-stanley, rah-elcano]
    status: verified
  - value: '1'
    unit: day
    label: Lost on the calendar
    explanation: >-
      At Cape Verde the crew found that the islanders’ date was a day ahead of their own logs. This
      was the first time the effect of sailing round the world westward was observed in practice.
    sources: [pigafetta-stanley, rah-elcano]
    status: verified
  - value: 6 Sep 1522
    label: The Victoria reaches Sanlúcar
    explanation: Two days later she was moored at Seville, where the voyage had begun.
    sources: [pigafetta-stanley, rah-elcano, elcano-letter-1522]
    status: verified

myths:
  - claim: Elcano planned the first voyage around the world.
    status: legend
    explanation: >-
      The voyage was planned by Magellan and Ruy Faleiro under a royal agreement of March 1518.
      Magellan commanded it until his death. Elcano sailed as master of the Concepción and only
      came to the fore after Mactan. A fair account gives both men distinct credit.
    sources: [rah-elcano]
  - claim: Everyone else on the Victoria died at sea.
    status: legend
    explanation: >-
      Many did die of hunger and scurvy. But Pigafetta records that some deserted at Timor, some were
      executed for crimes, and about a dozen were arrested at Cape Verde. Those men reached Spain
      later.
    sources: [pigafetta-stanley, rah-elcano]

otherSide:
  body: >-
    This was not a solo achievement. Magellan conceived and commanded the expedition. The Victoria’s
    survivors included Greek, Portuguese and Italian sailors, Antonio Pigafetta among them, and
    thirteen Asian men whom the sources describe as slaves. Elcano himself had taken part in
    the San Julián mutiny. At Cape Verde the crew tried to buy enslaved Africans to work the pumps,
    and when the Portuguese seized their boat, Elcano sailed away and left those men behind. The
    expedition sought spices and lands for the Crown. On Mactan, local people fought the
    intruders off, and Magellan was killed in that fight. The Crown
    was slow to pay its debts: Elcano’s mother was still claiming his unpaid pension in 1553.
  sources: [rah-elcano, pigafetta-stanley, elcano-testament-1526]

