comic:
  status: draft
  panels:
    - caption: Getaria, on the Basque coast. Juan Sebastián Elcano is born here around 1487.
      sources: [rah-elcano]
    - caption: August 1519. He sails from Seville as master of the Concepción, responsible for running the ship but not its commander.
      context: Magellan’s five ships are bound for the Moluccas, the Spice Islands.
      sources: [rah-elcano]
    - caption: Mactan, April 1521. Magellan is killed, and command of the expedition passes from hand to hand.
      sources: [rah-elcano, pigafetta-stanley]
    - caption: Tidore, December 1521. The Trinidad is leaking. The Victoria, under Elcano, will go home alone, heading west.
      note: The route ran through waters controlled by Portugal, Spain’s rival.
      sources: [rah-elcano]
    - caption: For about nine weeks gales hold the Victoria off the Cape of Good Hope. On 6 May 1522 she rounds it.
      sources: [rah-elcano, pigafetta-stanley]
    - caption: Cape Verde, July 1522. The crew find their calendar is a day behind. When the Portuguese seize the boat, Elcano cuts the anchor cable.
      sources: [rah-elcano, pigafetta-stanley]
    - caption: 6 September 1522. The Victoria reaches Sanlúcar with eighteen men aboard. The circle is closed.
      sources: [rah-elcano, pigafetta-stanley]
    - caption: Elcano writes to Charles V about the strait, the Moluccas and a voyage round the whole world.
      sources: [elcano-letter-1522, rah-elcano]

movie:
  title: The Long Way Home
  premise: A ship’s master with a criminal past inherits a broken expedition and must choose between a known ocean and a forbidden route.
  conflict: Bring a leaking ship and a starving crew home after the commander’s death, through a rival empire’s waters, without stopping.
  challenge: Leading men who never expected him to lead them, and deciding whom to leave behind.
  moments:
    - text: Tidore, 20–21 December 1521. The Trinidad stays behind for repairs, and the Victoria sails west under Elcano.
      sources: [rah-elcano]
    - text: Off the Cape of Good Hope, May 1522. After weeks of gales the Victoria rounds the Cape close inshore.
      sources: [rah-elcano, pigafetta-stanley]
    - text: Cape Verde, July 1522. The crew’s cover story falls apart, and Elcano cuts the cable and leaves his boat’s crew behind.
      sources: [rah-elcano, pigafetta-stanley]
  theme: Endurance, and a glory that belongs to many.

