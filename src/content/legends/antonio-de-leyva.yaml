chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Antonio de Leyva was born in 1480, in Navarre according to the Real Academia de la Historia.
      His father, Juan Martínez de Leiva, had been a general of the Catholic Monarchs. Antonio first
      fought at twenty-one, against the morisco rising in the Alpujarras, then went to Naples to serve
      under Gonzalo Fernández de Córdoba, the “Great Captain”. He was wounded at the battle of Ravenna
      in 1512, a defeat for Spain and its allies.
    sources: [rah-leiva, acami-pavia]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In 1524 Francis I of France crossed the Alps with a large army and retook Milan. The imperial
      commander, the marquis of Pescara, was too weak to fight a pitched battle. He split his troops
      among several towns and put Leyva in charge of Pavia, a walled city on the Ticino that controlled
      the road to the Alps. In late October the French king arrived in person to besiege it, expecting
      a quick surrender.
    sources: [rah-leiva, acami-pavia, britannica-pavia]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      The garrison repulsed the November assaults and repaired the breaches. When the French tried to
      divert the Ticino, heavy rain washed their dams away. When they destroyed the river mills,
      Leyva already had hand mills ready. Shortage of pay was the real danger. Germans deserted, mutiny
      threatened, and Leyva melted church silver to pay them. His sorties kept the besiegers on edge
      all winter.
    sources: [rah-leiva, acami-pavia]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      In early February 1525 the imperial relief army reached Pavia. Before dawn on 24 February it broke
      through the walls of the great park around Mirabello and attacked. Leyva was ill that day
      and had himself carried to the city gate in a chair. From there his sortie of Spanish and German
      soldiers pinned down the troops the French had left in the siege lines. Within hours the French army was
      shattered and Francis I was a prisoner.
    sources: [rah-leiva, acami-pavia, britannica-pavia]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Charles V rewarded Leyva with the government of the Milanese and the title of prince of Ascoli.
      He held Milan in 1527–28, crippled by gout and carried into action on a litter. In 1536 he was
      the emperor’s senior commander in the invasion of Provence. Plague swept the camp at Aix, and
      he died there on 7 September 1536. Pavia gave the Habsburgs the upper hand in Italy, but the war
      with France went on.
    sources: [rah-leiva, britannica-pavia]
    status: verified

facts:
  - value: '24 Feb 1525'
    label: Battle of Pavia
    explanation: The relief army attacks, the garrison sorties, and Francis I of France is captured.
    sources: [rah-leiva, acami-pavia, britannica-pavia]
    status: verified
  - value: '4'
    unit: months
    label: Length of the siege
    explanation: >-
      From the French arrival in late October 1524 (sources give 25 or 28 October) to the battle
      of 24 February 1525.
    sources: [rah-leiva, acami-pavia, britannica-pavia]
    status: verified
  - value: '800–7,000'
    unit: soldiers
    label: Size of the garrison
    explanation: >-
      Sources disagree sharply. The ACAMI paper lists 6,000 German landsknechts, 400 Spaniards,
      500 Italians, 250 lances and 16 guns. The RAH entry says Leyva had only 300 men-at-arms and
      500 infantry among 6,000 people in the city.
    sources: [acami-pavia, rah-leiva]
    status: disputed
  - value: '20,000–28,000'
    unit: men
    label: The French army at the battle
    explanation: >-
      Britannica gives both figures. The army Francis led into Italy for the whole campaign is put at
      over 40,000 (ACAMI) or 50,000 (RAH).
    sources: [britannica-pavia, acami-pavia, rah-leiva]
    status: disputed

myths:
  - claim: Pavia was a purely Spanish victory.
    status: legend
    explanation: >-
      It was won by a multinational imperial army. According to the ACAMI paper, most of Leyva’s garrison were
      German landsknechts, and the relief army had more Germans than Spaniards, together with Italian troops.
      Its commanders included a Burgundian viceroy (Lannoy), a marquis from Naples (Pescara) and a
      renegade French prince (Bourbon). Spanish arquebusiers did play a decisive part.
    sources: [acami-pavia, britannica-pavia, rah-leiva]
  - claim: Charles V once enlisted as “Carlos de Gante, soldier of the tercio of the valiant Antonio de Leyva.”
    status: legend
    explanation: >-
      The RAH entry presents this as a story “told as certain, repeated by various historians”, but it
      cites no contemporary source for it. It shows how Leyva was later remembered, not something we
      can verify.
    sources: [rah-leiva]

otherSide:
  body: >-
    Pavia’s victory had many fathers. The battle plan was Pescara’s, and the RAH entry gives him the
    leading role. Lannoy commanded the army, Bourbon led the heavy cavalry, and Georg von Frundsberg’s
    landsknechts destroyed the French army’s Black Band. The garrison itself was largely German and
    kept together only by money. The citizens of Pavia paid much of the cost: soldiers were billeted on
    them with orders to be fed, and their churches’ silver was melted down for wages. French losses
    were heavy, and many fleeing soldiers drowned in the Ticino. Nor did the victory settle anything
    for long. Francis repudiated the Treaty of Madrid as soon as he was free. In 1527 an unpaid imperial
    army sacked Rome while Leyva held Milan. The 1536 Provence campaign, made on Leyva’s advice,
    ended with the imperial army wrecked by plague.
  sources: [rah-leiva, acami-pavia, britannica-pavia]

