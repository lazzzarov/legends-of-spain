movie:
  title: The Key to Lombardy
  premise: An ageing, gout-ridden captain must keep a starving, unpaid, multinational garrison together until help arrives.
  conflict: Hold Pavia against a king’s army for a whole winter, without money, food or certainty of relief.
  challenge: Keeping mercenaries loyal when the only thing that binds them is pay that isn’t there.
  moments:
    - text: Winter 1524–25. Church silver is melted and struck into siege coins to pay the German garrison.
      sources: [rah-leiva, acami-pavia]
    - text: The French attempt to divert the Ticino is washed away by heavy rain. Hand mills replace the destroyed river mills.
      sources: [rah-leiva]
    - text: 24 February 1525. Carried to the gate in a chair, Leyva launches the sortie as the relief army breaks into the park of Mirabello.
      sources: [rah-leiva, acami-pavia]
  theme: Endurance as a team effort. Glory shared among many nations.

