tagline: His hungry, unpaid garrison held Pavia for four months, long enough for an empire to strike back.
hook: >-
  In the winter of 1524–25 the defenders of Pavia had no food to spare and no money. The German
  mercenaries who made up much of the garrison were threatening to leave unless they were paid.
  Antonio de Leyva billeted his soldiers on the townspeople, melted down the churches’ silver and
  struck coins reading: “The Caesarians besieged in Pavia, 1524.”
mainAchievement: Defence of Pavia, October 1524 – February 1525
