# SOURCED — researched 2026-11-02 (see production/fadrique-de-toledo/research.md).
# A joint Iberian operation: Castilian, Portuguese and Neapolitan forces under one king, with
# Portugal keeping its own institutions. Maíno's surrender scene is treated as invention.

