    explanation: >-
      The Real Academia de la Historia gives 52 vessels; the BRASILHIS dictionary gives 62. Counts
      differ depending on which squadrons and transports are included.
    sources: [rah-fadrique-de-toledo, brasilhis-fadrique-de-toledo]
    status: disputed
  - value: c. 12,000–12,600
    unit: men
    label: Soldiers from several kingdoms
    explanation: Castilian, Portuguese and Neapolitan troops; the RAH gives 12,000 men, BRASILHIS 12,563 soldiers.
    sources: [rah-fadrique-de-toledo, brasilhis-fadrique-de-toledo, schwartz-review-2024]
    status: disputed
  - value: '74'
    unit: days
    label: At sea before reaching Bahia
    explanation: From Cádiz on 14 January to the Bay of All Saints on 29 March 1625.
    sources: [brasilhis-fadrique-de-toledo]
    status: verified
  - value: 1 May 1625
    label: Salvador recovered
    explanation: The Dutch garrison surrendered on 30 April; Fadrique’s forces entered the city the next day.
    sources: [brasilhis-fadrique-de-toledo, rah-fadrique-de-toledo]
    status: verified

myths:
  - claim: Maíno’s famous painting shows how the Dutch surrendered.
    status: legend
    explanation: >-
      Maíno shows Fadrique pointing the defeated Dutch to a tapestry of Philip IV and Olivares. The
      Prado notes that no such episode appears in the accounts of the recapture: the scene is largely
      invented, drawing on Lope de Vega’s play El Brasil restituido (1625) and on printed relations of
      the campaign.
    sources: [prado-maino-bahia, schwartz-review-2024, monteiro-2024]
  - claim: The recapture of Bahia was a purely Spanish victory.
    status: legend
    explanation: >-
      It was a joint Iberian operation of Castilian, Portuguese and Neapolitan forces under the same
      king. Portugal kept its own institutions, and Portuguese commanders felt that Spanish command
      had reduced their share of the credit.
    sources: [schwartz-review-2024, rah-fadrique-de-toledo, brasilhis-fadrique-de-toledo]

otherSide:
  body: >-
    The victory looked different from Lisbon and from Bahia. Manuel de Meneses, who commanded the
    Portuguese contingent and was Portugal’s chief chronicler, wrote an account so critical of how the
    Portuguese were treated that the Council of State banned its publication; some in Portugal later
    accused the armada of sacking Salvador like an enemy city and shipping church silver to Spain, and
    a thousand soldiers were quartered on the city at its own expense. Spanish accounts blamed the fall
    of the city on New Christians, a charge rooted in religious prejudice. Bahia was a sugar colony
    worked by enslaved Africans: during the occupation many fled the plantations to seek freedom, and
    a company of about 200 Africans armed by the Dutch had its leader, Francisco, executed when the
    city was retaken.
  sources: [schwartz-review-2024, iglesias-magalhaes-2010]

