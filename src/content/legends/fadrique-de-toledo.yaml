movie:
  title: Two Crowns, One Fleet
  premise: An admiral must weld rival kingdoms’ ships and soldiers into one armada and carry it across an ocean to retake a lost capital.
  conflict: Dislodge an entrenched Dutch garrison from a fortified city half a world away.
  challenge: Holding together an alliance whose partners did not trust each other.
  moments:
    - text: May 1624 — Salvador da Bahia falls to the Dutch West India Company in less than a day.
      sources: [schwartz-review-2024]
    - text: 29 March 1625 — after 74 days at sea, the combined armada sails into the Bay of All Saints.
      sources: [brasilhis-fadrique-de-toledo]
    - text: 30 April–1 May 1625 — the Dutch surrender and the armada enters Salvador.
      sources: [brasilhis-fadrique-de-toledo, rah-fadrique-de-toledo]
  theme: Victory is shared — and so is the bill.

