tagline: An Iberian armada crossed the Atlantic to take back a captured capital.
hook: >-
  In May 1624 the Dutch West India Company seized Salvador, capital of Portuguese Brazil, in less
  than a day. Castile and Portugal answered with one of the largest fleets of the age. On 29 March
  1625, after 74 days at sea, Fadrique de Toledo led it into the Bay of All Saints — with a
  fortified enemy waiting ashore.
mainAchievement: Recapture of Salvador da Bahia, 1625
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Fadrique de Toledo Osorio was the second son of Pedro de Toledo, Marquis of Villafranca. The
      Real Academia de la Historia gives his birth as Naples, 30 May 1580; a more recent study argues
      for about 1589. He chose the sea. By 1618 he was captain general of the Armada of the Ocean Sea,
      and in August 1621 he defeated a stronger Dutch squadron off Cape St Vincent.
    sources: [rah-fadrique-de-toledo, brasilhis-fadrique-de-toledo]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In May 1624 the Dutch West India Company captured Salvador da Bahia, capital of Portuguese
      America; the city fell in less than a day. Portugal and Castile then shared a king, Philip IV,
      but Portugal kept its own laws and institutions. The loss struck at the Portuguese crown, at a
      sugar colony worked by enslaved Africans, and at the prestige of the whole Habsburg monarchy.
    sources: [schwartz-review-2024, iglesias-magalhaes-2010, rah-fadrique-de-toledo]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      The answer was a combined armada of Castilian, Portuguese and Neapolitan forces — between 52 and
      62 ships and around 12,000 men, depending on the count. Fadrique sailed from Cádiz on 14 January
      1625 and joined the Portuguese squadron of Manuel de Meneses at Cape Verde. Carrying so many
      soldiers across the Atlantic, and keeping them fed and healthy, was a feat in itself.
    sources: [brasilhis-fadrique-de-toledo, rah-fadrique-de-toledo, schwartz-review-2024]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      The fleet entered the Bay of All Saints on 29 March 1625 and besieged the Dutch garrison by
      land and sea. On 30 April the defenders surrendered, and on 1 May Fadrique’s forces entered
      Salvador. According to the Real Academia de la Historia they took more than 3,000 prisoners,
      seven ships, 259 guns and 18 flags. The news reached Madrid on 6 July.
    sources: [brasilhis-fadrique-de-toledo, rah-fadrique-de-toledo]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Bahia became one of the celebrated victories of 1625, and Juan Bautista Maíno painted it for the
      Hall of Realms in the Buen Retiro palace. In 1629 Fadrique drove the English and French from St
      Kitts. But in 1634 he refused to lead a poorly prepared expedition to retake Pernambuco, clashed
      with Olivares, was condemned and stripped of his honours, and died in Madrid that December.
    more: >-
      The punishment, according to the Real Academia de la Historia, included prison, a fine of
      10,000 ducats and ten years’ banishment from Castile. Within a few years of the triumph at
      Bahia, the Dutch had taken Recife and a long stretch of the Brazilian coast, which Portugal did
      not recover until 1654 — twenty years after Fadrique’s death.
    sources: [rah-fadrique-de-toledo, brasilhis-fadrique-de-toledo]
    status: verified

