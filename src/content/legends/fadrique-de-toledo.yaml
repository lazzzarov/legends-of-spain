media:
  - id: portrait
    file: portrait.jpg
    alt: Fadrique de Toledo, detail from Juan Bautista Maíno’s painting The Recapture of Bahía de Todos los Santos
    kind: historical
    title: The Recapture of Bahía de Todos los Santos (detail showing Fadrique de Toledo)
    creator: Juan Bautista Maíno
    date: 1634–1635
    posthumous: true
    institution: Museo del Prado, Madrid
    sourceUrl: https://commons.wikimedia.org/wiki/File:La_recuperaci%C3%B3n_de_Bah%C3%ADa,_Ma%C3%ADno.jpg
    license: Public domain (PD-old-100, as stated on Wikimedia Commons)
    attribution: Juan Bautista Maíno, The Recapture of Bahía de Todos los Santos, Museo del Prado
    notes: >-
      Commissioned at the end of 1634 and finished in 1635, so almost certainly completed after
      Fadrique’s death in December 1634. The surrounding scene is an invention; the figure is meant as
      his likeness. Alternative: the detail of Félix Castelo’s Recapture of St Kitts (Prado, P000654).
      Spanish LPI art. 128 may protect non-creative photographs of paintings for 25 years; prefer the
      Prado’s own image terms or an old reproduction.
      Downloaded 2026-11-03 (resized to ≤1000 px). The portrait file is a crop of Maíno’s painting showing Fadrique (standing, yellow doublet, pointing at the tapestry); the full painting is on Commons.
