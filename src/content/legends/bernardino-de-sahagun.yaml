tagline: With Nahua scholars and artists, a Franciscan friar compiled an encyclopedia of a world his own mission meant to change.
hook: >-
  In 1577 a royal order demanded that Fray Bernardino de Sahagún’s manuscripts be gathered up:
  writing about the old beliefs and way of life of Mexico’s Indigenous peoples was not wanted. For
  some thirty years he and Nahua scholars at Tlatelolco had been recording their world in Nahuatl.
  That same year their twelve illustrated books — today’s Florentine Codex — were completed.
mainAchievement: The Florentine Codex (Historia general de las cosas de Nueva España), completed 1575–1577 with Nahua collaborators
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Bernardino de Ribeira was born around 1499 in the town of Sahagún, in León, and took its name.
      He studied at the University of Salamanca, joined the Franciscans there, and in 1529 sailed for
      New Spain with a group of thirty friars. He threw himself into learning Nahuatl. His fellow
      friar Jerónimo de Mendieta judged that no one had gone further into the secrets and antiquities
      of the language.
    sources: [rah-sahagun]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In the early 1530s he climbed the volcanoes Popocatépetl and Iztaccíhuatl, driven, he said, by
      curiosity — and by the wish to destroy sacred images hidden there. From 1536 he taught Latin at
      the Colegio de Santa Cruz in Tlatelolco, founded to educate the sons of the Nahua nobility. His
      aim was missionary: preachers had to understand Nahua beliefs in order to turn their teaching
      against them.
    more: >-
      Sahagún wrote that his Tlatelolco students came to speak and write Latin and even to compose
      verse in it. Those students and their successors became the scholars without whom his later work
      would have been impossible.
    sources: [rah-sahagun]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      From 1547 Sahagún worked on a vast history in Nahuatl and Spanish, relying on the ablest
      Tlatelolco graduates. In 1570 some Franciscans objected to spending the order’s money on such
      writing; in 1573 a new superior had his papers scattered among the order’s houses. Then, in
      1577, a royal order demanded the manuscripts be collected. The work survived by persistence and
      by the labour of its Nahua makers.
    more: >-
      Sahagún reckoned that the project had cost more than a thousand pesos in ink, paper and
      scribes, and that if all the labour had been paid, ten thousand would not have been enough.
    sources: [rah-sahagun]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      The Florentine Codex was completed at Tlatelolco between 1575 and 1577, while epidemic disease
      ravaged central Mexico. Its twelve books cover gods, calendar, omens, rhetoric, kings, merchants,
      people and the natural world, in parallel columns of Nahuatl and Spanish, with some 2,500
      paintings by Nahua artists. Book 12 tells the conquest from the Mexica side. Its named makers
      include Antonio Valeriano, Alonso Vegerano, Martín Jacobita and Pedro de San Buenaventura.
    more: >-
      The Nahuatl column is the primary text; the Spanish column is Sahagún’s interpretation of it.
      In Book 12 the Spanish is much shorter, and paintings — of battles, Mexica heroism and atrocities
      by the conquistadors and their allies — fill the gaps. Diego de Grado, Bonifacio Maximiliano and
      Mateo Severino are named as scribes.
    sources: [getty-dfc-richter, getty-competing-narratives, getty-project, eid-megadeath]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      The manuscript was sent to Europe and is now in the Biblioteca Medicea Laurenziana in Florence;
      in 2015 it entered UNESCO’s Memory of the World Register. Sahagún died in Mexico City on 5
      February 1590. Today the codex is read as a collective work: one of the richest records of Nahua
      language, knowledge and memory, made inside a project that was meant to replace much of what it
      recorded.
    more: >-
      Since 2023 the Getty Research Institute’s Digital Florentine Codex has made the manuscript freely
      searchable, with transcriptions and translations, audio of the Nahuatl of Book 12 and summaries in
      modern Eastern Huasteca Nahuatl.
    sources: [getty-project, getty-competing-narratives, rah-sahagun, getty-dfc-richter]
    status: verified

