myths:
  - claim: Sahagún was the first anthropologist.
    status: disputed
    explanation: >-
      Some scholars, including his biographer for the Real Academia de la Historia, call him a father
      of cultural anthropology: he collected testimony systematically in Nahuatl. But his stated aim
      was to help preachers uproot Nahua religion, and the knowledge came from Nahua scholars and
      informants working under colonial rule. The label fits only with those qualifications.
    sources: [rah-sahagun, getty-competing-narratives]
  - claim: The Florentine Codex is Sahagún’s book.
    status: legend
    explanation: >-
      The Nahuatl text is the primary one and the paintings are the work of Nahua artists. Getty
      researchers name seven Nahua grammarians and scribes and identify many more artists’ hands.
      Sahagún directed and interpreted the project; he did not write it alone.
    sources: [getty-competing-narratives, getty-dfc-richter]

otherSide:
  body: >-
    The Florentine Codex records a culture and attacks it at the same time. Sahagún wrote that
    preachers needed to know Nahua beliefs in order to turn their teaching against them; he himself
    destroyed sacred images, and his Psalmodia christiana (1583) was written so that Nahua Christians
    would abandon their old songs. Its Nahua makers — Antonio Valeriano, Martín Jacobita and others —
    worked under colonial rule, for an order that after 1527 admitted no Indigenous men as friars or
    priests. The work was made amid catastrophe: the epidemics of 1545 and 1576 killed millions in
    central Mexico. Sahagún called the conquest “a horrible thing” yet justified it by conversion.
    Book 12 preserves Mexica memories of the war, and its Nahuatl text and paintings say more than its
    shorter Spanish column.
  sources: [rah-sahagun, getty-competing-narratives, getty-dfc-richter, eid-megadeath]

