movie:
  title: The Twelve Books
  premise: >-
    In a college in Tlatelolco, Nahua scholars and a Franciscan friar spend thirty years recording
    a world — each for very different reasons.
  conflict: >-
    A missionary who wants to understand Nahua religion in order to uproot it, Nahua scholars who
    preserve their ancestors’ knowledge, and a Church and Crown that come to distrust the whole project.
  challenge: Making the collaborators, not only the friar, the authors of the story.
  moments:
    - text: 6 January 1536 — the Colegio de Santa Cruz opens in Tlatelolco to educate the sons of the Nahua nobility.
      sources: [rah-sahagun]
    - text: 1573 — a new Franciscan superior orders Sahagún’s papers to be dispersed among the order’s houses.
      sources: [rah-sahagun]
    - text: 1575–1577 — amid an epidemic, the twelve books are completed, just as a royal order demands the manuscripts be collected.
      sources: [getty-dfc-richter, rah-sahagun, eid-megadeath]
  theme: Knowledge saved by the people it was meant to change.

