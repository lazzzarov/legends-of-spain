movie:
  title: Arm to Arm
  premise: A royal surgeon, a foundling-home rector and a group of children carry a living vaccine around the world.
  conflict: Keep a fragile biological chain alive across oceans, against heat, distance, officials who will not help and a shortage of children.
  challenge: The mission works only by using children who cannot choose, and the people leading it know it.
  moments:
    - text: A Coruña, 30 November 1803 — 22 foundling boys and Isabel Zendal board the María Pita.
      sources: [tuells-duro-2015, rah-balmis]
    - text: Caracas, 8 May 1804 — the expedition splits; Salvany and Balmis will never meet again.
      sources: [tuells-duro-2015, rah-salvany]
    - text: Manila, 15 April 1805 — after a miserable Pacific crossing, 26 Mexican children bring the vaccine to the Philippines.
      sources: [tuells-duro-2015]
  theme: A triumph of public health, and the question of who paid for it.

