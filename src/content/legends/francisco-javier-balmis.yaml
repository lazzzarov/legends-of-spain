tagline: Before refrigeration, he carried a living vaccine across two oceans — arm to arm, in the bodies of children.
hook: >-
  In March 1804 the vaccine expedition left Puerto Rico short of children. By the time it neared
  the Venezuelan coast, only one child still carried live vaccine in his arm. The cowpox brought
  from Spain survived only by passing from arm to arm; if that chain broke, the whole voyage would
  have been for nothing.
mainAchievement: Directed the Royal Philanthropic Vaccine Expedition, 1803–1806
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Francisco Javier Balmis was born in Alicante in 1753, the son and grandson of surgeons. He
      trained at the city’s military hospital, served as an army surgeon and spent a decade in the
      Caribbean and New Spain, where he studied medicinal plants. When Edward Jenner made cowpox
      vaccination public, Balmis became one of its earliest Spanish champions, translating Moreau de
      la Sarthe’s treatise on the vaccine in 1803. He had not invented the vaccine. His idea was how
      to move it.
    sources: [rah-balmis, red-defensa-2019]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      Smallpox killed and disfigured people across Spain’s empire, and the vaccine was fragile.
      Earlier attempts to ship cowpox material in sealed glass had failed on long, hot voyages. In
      June 1803 the royal surgeons approved Balmis’s plan: carry the vaccine alive, in children who
      had never had smallpox. Roughly every week, two children would be vaccinated with fluid from
      the ripe pustules of the previous pair. It was a human chain that could not be allowed to
      break.
    sources: [rah-balmis, tuells-duro-2015]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      On 30 November 1803 the corvette María Pita left A Coruña carrying 22 boys aged three to
      nine, foundlings from institutions in A Coruña and Santiago de Compostela. Nobody asked their
      consent. Caring for them was Isabel Zendal, rector of the A Coruña foundling home, whose
      adoptive son was among them. In Puerto Rico the vaccine had already arrived from a neighbouring
      island, and the expedition left so short of children that only one still carried live vaccine
      when it neared Venezuela.
    sources: [tuells-duro-2015, rah-balmis, red-defensa-2019]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      In Caracas the vaccine took hold, and Balmis set up the first vaccination board on the
      American mainland. On 8 May 1804 the expedition split. José Salvany led a team south through
      New Granada, Quito, Lima and the Andes. He lost an eye, injured a wrist and died in Cochabamba
      in 1810. Balmis went on through Cuba and Mexico, then crossed the Pacific with 26 Mexican
      children, reaching Manila on 15 April 1805. From there he took the vaccine to Macao and
      Canton.
    sources: [tuells-duro-2015, rah-balmis, rah-salvany]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Balmis sailed home by way of Saint Helena, where he introduced the vaccine, and reached Lisbon
      on 14 August 1806. The lasting work was institutional: vaccination boards in Caracas, Havana,
      Mexico, Manila and beyond, where local doctors would keep the vaccine alive. Jenner himself
      praised the expedition. But the children paid a price. The Galician boys were left in a Mexico
      City poorhouse and never returned to Spain. Balmis died in Madrid in 1819.
    more: >-
      The expedition belonged to many people. Isabel Zendal looked after the children through every
      stage, from A Coruña to the Philippines, and Balmis wrote to the minister Caballero that she had
      ruined her health caring for them. Salvany’s team carried the vaccine through much of South
      America; Salvany never came home. In 1810 Balmis returned to Mexico on a second commission and
      protested to the authorities that the promises made to the children and their families — care,
      education and a future — had not been kept.
    sources: [rah-balmis, tuells-duro-2015, tuells-franco-paredes-2023, rah-salvany]
    status: verified

