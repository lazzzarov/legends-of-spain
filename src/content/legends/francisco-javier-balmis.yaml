myths:
  - claim: Balmis invented the smallpox vaccine.
    status: legend
    explanation: >-
      Edward Jenner demonstrated cowpox vaccination in 1796–1798. Balmis’s achievement was
      organising how to carry a living vaccine across oceans and how to keep it going afterwards,
      through vaccination boards and trained local practitioners.
    sources: [rah-balmis, tuells-duro-2015]
  - claim: All the children who carried the vaccine were orphans.
    status: legend
    explanation: >-
      The 22 boys from A Coruña were foundlings from charitable institutions. Most of the 26 Mexican
      children taken to the Philippines had known parents, who were offered money and promises of
      care and education in return for lending their sons. Many of those promises were not kept.
    sources: [tuells-duro-2015, tuells-franco-paredes-2023]

otherSide:
  body: >-
    The expedition’s success depended on children who could not consent. Foundlings were chosen
    because no parent would hand a child to a stranger for such a voyage, and they were used as
    living containers for the vaccine. On the Pacific crossing the children slept on the floor of a
    filthy, rat-infested hold, and several were accidentally infected from one another. In Mexico the
    Galician boys were placed in a poorhouse and made to light funerals. They never returned to
    Spain, and Mexican families who had lent their sons for payment and promises were left
    disappointed. Balmis protested about the children’s treatment more than once, as late as 1810.
    In Havana, when the authorities supplied no children, the expedition bought enslaved women
    (three according to the RAH biography, while one archival note speaks of four slaves) and
    recruited a drummer boy to keep the chain alive. Modern historians agree that the expedition
    would not pass today’s ethical standards. They dispute claims that it systematically exploited
    enslaved children, and they credit Isabel Zendal, José Salvany and the children as much as
    Balmis. The expedition was also a project of the Spanish crown, which linked public health to
    the size and productivity of its empire’s population.
  sources: [tuells-duro-2015, rah-balmis, tuells-franco-paredes-2023]

