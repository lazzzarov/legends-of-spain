    - caption: Burgos. Francisco Sarmiento keeps the tower and gate of Santa María from the age of eighteen.
      sources: [rah-sarmiento]
    - caption: October 1538. The Holy League takes Castelnuovo, on the Bay of Kotor. Sarmiento’s Spaniards are left to hold it.
      sources: [rah-sarmiento, gonzalez-castrillo-2013]
    - caption: All winter they dig bastions and patch the walls. In June, word comes that Barbarossa is on his way.
      sources: [rah-sarmiento]
    - caption: July 1539. Barbarossa’s fleet fills the bay, and an army comes overland.
      context: Estimates of the Ottoman strength range from about 22,000 to 150,000.
      sources: [floristan-2023, gonzalez-castrillo-2013]
    - caption: 23 July. An offer arrives. Leave with your banners and your clothes, sail to Apulia, and every soldier gets twenty ducats.
      sources: [alcaraz-tapia-1539, floristan-2023]
    - caption: Sarmiento consults his captains, and they consult their officers. The answer is unanimous.
      note: >-
        Reported speech from the corporals’ sworn statement, translated. Original: “que querían morir
        en servicio de Dios y de su Maestá y que viniessen quando quisiessen”.
      dialogue:
        - speaker: The captains of Castelnuovo, as reported by Alcaraz and Tapia
          text: They would rather die in the service of God and of His Majesty, and the enemy could come whenever they pleased.
