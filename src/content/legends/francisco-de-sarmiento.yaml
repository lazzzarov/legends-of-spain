tagline: Offered safe passage and twenty ducats a man, the garrison of Castelnuovo chose to fight.
hook: >-
  On 23 July 1539 a renegade Spaniard brought Castelnuovo a letter from the Ottoman land
  commander: leave with your banners flying, sail to Apulia, and every soldier gets twenty
  ducats. Francisco de Sarmiento put it to his captains, and they to their officers. Two survivors
  later swore to the answer: they would rather die.
mainAchievement: Held Castelnuovo against a far larger Ottoman force, July–August 1539
