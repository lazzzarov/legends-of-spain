movie:
  title: When They Please
  premise: >-
    A garrison left behind on a hostile coast receives a generous offer to leave, and turns it down.
  conflict: >-
    Hold a weak fortress against an overwhelming Ottoman army and fleet, with no relief on the way.
  challenge: Keeping a council of captains, and thousands of men, united in a choice that means death.
  moments:
    - text: 23 July 1539. The Ottoman ultimatum, and the unanimous refusal after Sarmiento consults his captains.
      sources: [alcaraz-tapia-1539, floristan-2023]
    - text: 1 August 1539. A deserting gunner advises Barbarossa to concentrate fire on the upper castle.
      sources: [alcaraz-tapia-1539, gonzalez-castrillo-2013]
    - text: 7 August 1539. Sarmiento, wounded and mounted, refuses a rope into the lower castle and charges the janissaries.
      sources: [alcaraz-tapia-1539, rah-sarmiento]
  theme: Courage and its price. Honour honestly weighed against a strategy that had already given up.

places:
  - name: Herceg Novi (historic Castelnuovo)
    relation: The fortress town Sarmiento garrisoned in 1538–1539 and where he died. The RAH biography credits him with raising the sea tower.
    location: Bay of Kotor, Montenegro
    sources: [rah-sarmiento, floristan-2023]
  - name: Arco de Santa María
    relation: Sarmiento was alcaide of the tower and gate of Santa María la Blanca (today the Arco de Santa María) from the age of eighteen.
    location: Burgos, Castile and León
    sources: [rah-sarmiento]
  - name: Cloister of the former Convento de San Juan
    relation: Displays the preserved doorway of the house Sarmiento built in Burgos, which his daughter later sold to pay his debts.
    location: Burgos, Castile and León
    sources: [rah-sarmiento]

