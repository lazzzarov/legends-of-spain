chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Francisco Sarmiento was born around 1498 in Burgos, into a well-connected Castilian family.
      From the age of eighteen he kept the tower and gate of Santa María, the city’s ceremonial
      entrance. When Burgos rose in the Comunero revolt of 1520 he held the royal banner in the
      parishes beside the castle. Rewarded with command of a company of three hundred men, he
      fought in Navarre in 1521 and at the long siege of Fuenterrabía.
    sources: [rah-sarmiento]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In 1529 he raised another company and followed Charles V to Italy. Over the next decade he
      fought at Florence, marched to defend Vienna, held Coron in Greece and stormed La Goleta at
      Tunis. In 1536 he became maestre de campo. Two years later his tercio sailed with the Holy
      League fleet, which took the Ottoman port of Castelnuovo, on the Bay of Kotor, in October
      1538. The garrison left to hold it was entirely Spanish, apart from a few light horsemen.
    sources: [rah-sarmiento, gonzalez-castrillo-2013]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      Castelnuovo was a weak place, overlooked by higher ground. Through the winter Sarmiento’s men
      dug bastions, casemates and mines and patched the walls with what they could find. In June 1539,
      hearing that Barbarossa was coming, he sent captains to Italy to beg for help. The viceroy’s
      reply, which never reached him, shows that no relief was planned. In mid-July the Ottoman
      fleet and army arrived. Estimates of their size vary enormously.
    sources: [rah-sarmiento, floristan-2023, gonzalez-castrillo-2013]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      The ultimatum was refused on 23 July. For a fortnight the guns pounded the town, and the
      defenders beat back assault after assault. On 1 August a deserter told Barbarossa to aim
      everything at the upper castle, which was then flattened. By 7 August the defences had
      given way. According to the two corporals, Sarmiento, wounded and on horseback, was offered a
      rope to climb into the lower castle. He refused and rode at the janissaries. His body was never
      identified.
    sources: [alcaraz-tapia-1539, floristan-2023, rah-sarmiento]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Several hundred defenders, along with women, children and merchants, were taken captive.
      Charles V tried to ransom them, but some were still slaves in Constantinople years later.
      Chroniclers and poets turned the siege into a byword for courage. The best evidence, though,
      comes from two ordinary soldiers, Juan de Alcaraz and Juan de Tapia, who escaped and gave
      sworn testimony at Andria, in Apulia, on 4 September 1539.
    more: >-
      Their statement survives in a copy in the Archivo de los Duques de Alba in Madrid. José M.
      Floristán published it in full in 2023. It agrees with the chronicles in outline but differs
      in details, and its huge figures for the Ottoman army and Ottoman losses served, as Floristán
      notes, to underline both the inevitability of the defeat and the heroism of the defence.
    sources: [gonzalez-castrillo-2013, floristan-2023, alcaraz-tapia-1539]
    status: verified

facts:
  - value: '23 Jul 1539'
    label: The offer refused
    explanation: >-
      Safe passage to Apulia in Ragusan ships, banners flying, and twenty ducats for every soldier,
      but no guns or munitions. The captains’ answer was unanimous.
    sources: [alcaraz-tapia-1539, floristan-2023]
    status: verified
  - value: '2,500–4,000'
    unit: defenders
    label: Size of the Spanish garrison
    explanation: >-
      Sources disagree. Chronicles give 2,500, 3,000 or nearly 4,000 men, and one says fewer than
      3,000 were left when the siege began. The RAH biography describes twelve companies of three
      hundred men each, plus eighty-five light horsemen.
    sources: [gonzalez-castrillo-2013, rah-sarmiento]
    status: disputed
  - value: '22,000–150,000'
    unit: attackers
    label: Size of the Ottoman force
    explanation: >-
      Andrea Doria’s report gives 18,000 Turks and 4,000 janissaries. Sandoval writes of 30,000
      infantry by land plus the troops of the fleet. The two corporals claim 20,000 aboard ship and
      130,000 by land. All agree the defenders were vastly outnumbered.
    sources: [gonzalez-castrillo-2013, floristan-2023, alcaraz-tapia-1539]
    status: disputed
  - value: '200–800'
    unit: survivors
    label: Taken alive
    explanation: >-
      The corporals count about 400 captives. Sandoval says some 800 people of every kind survived,
      women and boys included. A report of 23 August 1539 speaks of about 200 soldiers escaping.
    sources: [floristan-2023, gonzalez-castrillo-2013]
    status: disputed

myths:
  - claim: Sarmiento personally sent back the defiant reply “Let them come when they will.”
    status: legend
    explanation: >-
      The nearest source is the corporals’ sworn statement. It reports the reply indirectly, as a
      collective decision. Sarmiento consulted all his captains, the captains consulted their
      officers, and they resolved to die in the service of God and the emperor, adding that the
      enemy could come whenever they pleased. It was a council’s answer, not a single man’s line.
    sources: [alcaraz-tapia-1539, floristan-2023]
  - claim: Every defender of Castelnuovo died fighting.
    status: legend
    explanation: >-
      Most of the garrison died, and the wounded were killed where they lay. But hundreds were taken
      captive, among them several captains, the bishop and non-combatants. Some escaped or were later
      ransomed. That is how the two corporals lived to tell the story.
    sources: [floristan-2023, gonzalez-castrillo-2013]

otherSide:
  body: >-
    Castelnuovo was a tactical feat and a strategic dead end. It had been taken in 1538 to make up
    for the League’s failure at Preveza, and Doria and Gonzaga had even promised to bring the
    garrison home in spring. When Barbarossa came, Venice was already negotiating with the sultan,
    and the RAH biography concludes that there was never any will to relieve or evacuate the men.
    Whether their sacrifice was justified in practical terms, as González Castrillo puts it, is
    another question. The cost fell on many people. The wounded were killed where they lay. Women,
    children and merchants sheltering in the lower castle were enslaved, and the town was burned.
    Some captives were reported still unransomed in Constantinople in the 1550s. The town had been
    Ottoman, with a Slav population, before the Spaniards took it, and its capture in 1538 had
    already produced some 1,600 prisoners. Casualty figures were inflated on every side. The
    corporals put Ottoman dead at 40,000, while Doria’s own report says about 3,000.
  sources: [rah-sarmiento, gonzalez-castrillo-2013, floristan-2023]

