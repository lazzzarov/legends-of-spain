    - caption: Two interpreters make every conversation possible — Jerónimo de Aguilar and Malintzin, a Nahua woman enslaved as a girl.
      sources: [rah-cortes, navarrete-coalicion]
    - caption: September 1519. After fierce battles, the Tlaxcalans choose an alliance against their old enemies, the Mexica.
