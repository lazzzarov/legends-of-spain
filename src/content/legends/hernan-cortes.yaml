    - caption: Cholula, October 1519. The Spaniards and their allies massacre thousands of people.
      note: Cortés claimed he was forestalling a plot. Show the aftermath, not the violence as spectacle.
      sources: [rah-cortes, navarrete-guerra]
    - caption: May 1520. Pedro de Alvarado’s men massacre the Mexica nobles gathered for the festival of Toxcatl. The city rises.
      sources: [olivier-toxcatl, navarrete-coalicion]
    - caption: July 1520. After a night flight from Tenochtitlan, the survivors reach Tlaxcala — whose rulers set new terms.
      sources: [rah-cortes, navarrete-guerra]
    - caption: 1521. Brigantines on the lake, a coalition army on the causeways, and smallpox inside the city.
      sources: [rah-cortes, navarrete-coalicion, eid-megadeath]
    - caption: 13 August 1521. Tenochtitlan falls. Nahua authors will later record the war in Book 12 of the Florentine Codex.
