movie:
  title: The Interpreters’ War
  premise: >-
    A Spanish captain, a Nahua interpreter and the rulers of Tlaxcala each try to use the others
    to win a war against the most powerful city in Mesoamerica.
  conflict: >-
    Rival agendas inside one coalition — Spanish greed for gold, Tlaxcalan determination to break
    Mexica power, Malintzin’s survival — against a city that will not surrender.
  challenge: Telling a story of alliance and atrocity without letting any single voice own it.
  moments:
    - text: September 1519 — after fighting the Spaniards, Tlaxcala’s leaders decide to ally with them against the Mexica.
      sources: [rah-cortes, navarrete-guerra]
    - text: May 1520 — Pedro de Alvarado’s men massacre the Mexica nobility at the festival of Toxcatl, and the war begins in earnest.
      sources: [olivier-toxcatl, navarrete-coalicion]
    - text: July 1520 — the survivors of the flight from Tenochtitlan reach Tlaxcala, and its rulers demand better terms before feeding them.
      sources: [navarrete-guerra, rah-cortes]
  theme: Victory is made by many hands — and so is its cost.

