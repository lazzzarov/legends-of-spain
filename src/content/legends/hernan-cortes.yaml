tagline: He led a few hundred Spaniards into Mexico — but Tenochtitlan fell to a vast Indigenous coalition, to smallpox and to siege.
hook: >-
  In July 1520 Cortés’s battered force limped into Tlaxcala. Days earlier it had fled
  Tenochtitlan by night, losing hundreds of Spaniards and thousands of Indigenous allies on the
  causeways. Now the rulers of Tlaxcala held his fate in their hands, and they demanded new, more
  favourable terms before they would feed him. Everything that followed depended on their decision.
mainAchievement: Fall of Mexico-Tenochtitlan, 1521, as leader of the Spanish contingent in an Indigenous-led coalition
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Hernán Cortés was born in 1485 in Medellín, Extremadura, into a family of minor nobility and
      modest means. He spent two years in Salamanca but left without a degree, and around 1504 he
      sailed for Hispaniola. In 1511 he joined the conquest of Cuba as a secretary, was granted
      Indigenous people in encomienda — tribute and forced labour — and grew rich from cattle and
      gold mines. He had almost no military experience.
    sources: [rah-cortes]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In 1518 Governor Diego Velázquez chose Cortés to lead an expedition to the mainland, then tried
      to replace him. Cortés sailed early, in February 1519, with roughly five hundred soldiers, in
      open defiance of the man who had appointed him. To speak with anyone he needed interpreters:
      Jerónimo de Aguilar, a Spaniard who had lived among the Maya, and Malintzin, a Nahua woman
      enslaved as a girl and handed to the Spaniards by the lords of Tabasco.
    more: >-
      Malintzin spoke Nahuatl and Maya languages; Aguilar translated between Maya and Spanish. Federico
      Navarrete argues that everything Cortés learned about Mesoamerican politics — who his friends and
      enemies might be, which roads to take — reached him through Malintzin and through his local
      allies. The expedition was privately financed by Velázquez, Cortés and other investors, without
      any contribution from the Crown.
    sources: [rah-cortes, navarrete-coalicion, paz-nomey-malintzin]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      The Totonacs of Cempoala broke with the Mexica and supplied porters and warriors. In September
      1519 the Tlaxcalans fought the newcomers hard, then chose an alliance against their old enemy.
      In October, at Cholula, the Spaniards and their allies massacred thousands of people. In May
      1520, while Cortés was away, Pedro de Alvarado’s men massacred the Mexica nobility gathered for
      the festival of Toxcatl at the Templo Mayor. The city rose.
    more: >-
      Cortés claimed Cholula was planning to ambush him; Navarrete notes that the Tlaxcalans, Cholula’s
      rivals, had convinced the Spaniards it was an enemy. Cortés’s own letters to the emperor do not
      mention the Toxcatl massacre at all. On the night of 30 June 1520 the Spaniards and their allies
      fled Tenochtitlan across the causeways; Moctezuma had died in disputed circumstances.
    sources: [rah-cortes, navarrete-guerra, olivier-toxcatl, navarrete-coalicion]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      The reconquest was a Mesoamerican war. Tlaxcalans, Texcocans, Chalcas, Otomís and others
      fought for their own aims; Navarrete argues that the allies shaped the strategy of dismantling
      Mexica tribute networks before the siege. Thirteen brigantines built in Tlaxcala closed the
      lake, and the aqueduct was cut. Smallpox struck the besieged city. After weeks of fighting
      house by house, Tenochtitlan fell on 13 August 1521.
    more: >-
      The Mexica leader Cuauhtémoc was captured as the city fell. Navarrete calls the siege the first
      colonial “total war”: neither the Spaniards nor their allies could afford to lose, and the
      traditional Mesoamerican way of ending a war — a negotiated surrender — never came.
    sources: [rah-cortes, navarrete-coalicion, navarrete-guerra, eid-megadeath]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      As governor of New Spain, Cortés handed out encomiendas, rebuilt the city on the ruins of
      Tenochtitlan and used enslaved Indigenous and African labour on his estates. On a march to
      Honduras he had Cuauhtémoc executed. The emperor made him Marqués del Valle in 1529 but kept real power from
      him. He died near Seville in 1547. The colony he helped found was built on conquest, coercion and
      a demographic catastrophe.
    more: >-
      Tlaxcala was exempted from encomienda as a reward for its alliance. Cortés also financed expeditions to Baja California and
      the gulf that still bears his name. The execution of Cuauhtémoc during the march to Honduras was
      criticised even by his fellow conquistador Bernal Díaz del Castillo.
    sources: [rah-cortes, eid-megadeath]
    status: verified

facts:
  - value: Feb 1519
    label: Sails from Cuba
    explanation: Leaving early, in defiance of Governor Diego Velázquez, who had tried to replace him.
    sources: [rah-cortes]
    status: verified
  - value: 25,000–200,000
    label: Indigenous allies in the war
    explanation: >-
      A Spanish-derived count of the review at Texcoco in May 1521 gives about 25,000 allied
      warriors, 16,000 of them Tlaxcalan, beside some 900 Spaniards. Navarrete estimates the coalition
      at 100,000–200,000 Mesoamericans, against fewer than 1,000 Spaniards.
    sources: [rah-cortes, paz-nomey-malintzin]
    status: disputed
  - value: 13 Aug 1521
    label: Tenochtitlan falls
    explanation: After a siege by land and water that began at the end of May 1521.
    sources: [rah-cortes]
    status: verified
  - value: 5–8 million
    label: Deaths in the smallpox epidemic of 1519–1520
    explanation: >-
      An estimate for central Mexico. Population figures for this period are reconstructions and
      vary widely between historians.
    sources: [eid-megadeath]
    status: disputed

myths:
  - claim: About five hundred Spaniards conquered the Aztec Empire.
    status: legend
    explanation: >-
      The Spanish contingent never reached a thousand men. Tenochtitlan fell to a coalition of tens
      of thousands of Indigenous warriors — Tlaxcalans, Texcocans, Chalcas, Otomís and others — who
      pursued their own goals, and to an epidemic that ravaged the besieged city.
    sources: [rah-cortes, navarrete-coalicion, navarrete-guerra, paz-nomey-malintzin]
  - claim: The Mexica took Cortés for the returning god Quetzalcoatl.
    status: disputed
    explanation: >-
      Several colonial sources link Cortés with Quetzalcoatl, and the Nahuatl word teotl, applied to
      the Spaniards, can mean “god”. But it had other meanings too, and historians still debate how far
      the identification was a Mexica belief and how far it was shaped by Cortés and later writers.
    sources: [dupey-quetzalcoatl]

otherSide:
  body: >-
    The fall of Tenochtitlan was not one man’s achievement. It was won by an Indigenous coalition
    whose leaders had their own reasons to destroy Mexica power, by Malintzin’s work as interpreter and
    negotiator, and by smallpox. The war included massacres at Cholula and the Templo Mayor, the
    enslavement of captives — Navarrete notes that slaves and gold were kept for the Spaniards — and the
    destruction of the Mexica capital. What followed was encomienda labour, the suppression
    of Indigenous religion and, with later epidemics, a collapse of the Indigenous population that
    took centuries to recover. Cortés’s own letters were legal arguments that left out the Toxcatl
    massacre; Book 12 of the Florentine Codex, written by Nahua authors, records the war from the
    side of the Mexica.
  sources:
    [
      navarrete-coalicion,
      navarrete-guerra,
      olivier-toxcatl,
      rah-cortes,
      eid-megadeath,
      getty-competing-narratives,
    ]

