# See production/francisco-pizarro/research.md for the claim → source table, disputed points and open questions.
# Ethical framing: Cajamarca is stated plainly as a massacre of an unresisting retinue; the Andean civil war,
# Andean allies, disease (disputed) and the human consequences carry equal weight with Pizarro's persistence.

