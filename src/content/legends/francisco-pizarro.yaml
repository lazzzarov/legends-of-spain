movie:
  title: The Book and the Square
  premise: >-
    An illiterate soldier and an Inca emperor meet in a square at Cajamarca — each convinced he holds
    the advantage, neither able to understand the other.
  conflict: >-
    A tiny, Crown-licensed expedition against a ruler who has just won a civil war, with Andean
    peoples deciding which side to back.
  challenge: Showing persistence and audacity without turning a massacre into a triumph.
  moments:
    - text: The island of Gallo, 1527 — ordered home, Pizarro refuses, and thirteen men stay with him.
      sources: [rah-pizarro]
    - text: Cajamarca, 16 November 1532 — Valverde’s book falls, the ambush is sprung and Atahualpa is seized.
      sources: [maccormack-atahualpa, xerez-relacion]
    - text: Cajamarca, 26 July 1533 — after delivering a vast ransom in gold and silver, Atahualpa is garrotted.
      sources: [rah-pizarro]
  theme: Ambition that wins everything and destroys almost everyone it touches.

