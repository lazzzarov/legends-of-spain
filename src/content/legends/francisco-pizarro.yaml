chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Francisco Pizarro was born around 1478 in Trujillo, Extremadura, the illegitimate son of a
      hidalgo and a servant, Francisca González. He grew up poor and never learned to read. In 1502
      he sailed for Hispaniola and spent two decades as a soldier in the Caribbean and Panama. He was
      with Vasco Núñez de Balboa when Europeans first saw the Pacific in 1513 — and five years later
      arrested Balboa on the governor’s orders.
    sources: [rah-pizarro]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In Panama, Pizarro formed a company with Diego de Almagro and the cleric Hernando de Luque to
      find a rich land rumoured to lie to the south. Voyages from 1524 brought hunger, deaths and
      battles along the mangrove coast; Pizarro was wounded seven times. In 1527, stranded on the
      island of Gallo, he refused a governor’s order to return. Only thirteen men stayed with him.
    more: >-
      Their persistence paid off at Tumbes, an Inca town on the coast, where they saw clear signs of a
      great and wealthy state. Pizarro then sailed to Spain to negotiate directly with the Crown,
      leaving his partners in Panama.
    sources: [rah-pizarro, xerez-relacion]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      The Capitulación de Toledo of 26 July 1529 made Pizarro governor of a land not yet conquered.
      In January 1531 he left Panama with about 180 men. The Andean world he entered was in crisis:
      after the death of the Inca Huayna Capac, his sons Huáscar and Atahualpa had fought a war of
      succession, and peoples ruled from Cuzco, such as the Huancas and Chachapoyas, saw in the
      newcomers allies against Inca rule.
    more: >-
      Huayna Capac died in an epidemic in the late 1520s. It is often identified as smallpox carried
      ahead of the Spaniards, but historians such as Robert McCaa have questioned that diagnosis and
      argue that smallpox became a major killer in the Andes only decades later. By November 1532
      Atahualpa’s generals had defeated and captured Huáscar.
    sources: [rah-pizarro, mccaa-smallpox, xerez-relacion]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      On 16 November 1532 Atahualpa entered the square of Cajamarca on a gilded litter. The friar
      Vicente de Valverde addressed him and handed him a book; when Atahualpa let it fall, Valverde
      gave the agreed signal. Guns fired and horsemen charged into the crowd. Pizarro’s secretary,
      Francisco de Xerez, wrote that no Indian raised a weapon against a Spaniard. The lords carrying
      the litter were killed and Atahualpa was seized.
    more: >-
      Xerez estimated that some 2,000 people were killed, not counting the wounded, and that only
      nightfall stopped the slaughter. The next day the Spaniards plundered Atahualpa’s camp and took
      captured men and women as servants. Later writers, Spanish and Andean, retold the scene of the
      book again and again to argue about whether the conquest was lawful.
    sources: [xerez-relacion, maccormack-atahualpa, rah-pizarro]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Atahualpa delivered a vast ransom in gold and silver, then was tried on charges built partly on
      an unproven rumour and garrotted on 26 July 1533. With Andean allies, Pizarro’s forces entered
      Cuzco in November 1533; on 18 January 1535 he founded Lima. Manco Inca’s rising of 1536 besieged
      both cities. The conquerors then fought each other: Almagro was executed in 1538, and his
      followers killed Pizarro in Lima on 26 June 1541.
    more: >-
      His remains are in Lima Cathedral; a lead box holding his skull was found in the crypt in 1977
      and the remains were moved to a remodelled chapel in 1985. After the siege of Cuzco, Manco Inca
      and his followers withdrew to the mountains of Vilcabamba.
    sources: [rah-pizarro]
    status: verified

facts:
  - value: 26 Jul 1529
    label: Capitulación de Toledo
    explanation: The Crown names Pizarro governor, adelantado and alguacil mayor of Peru before it is conquered.
    sources: [rah-pizarro]
    status: verified
  - value: 160–200
    label: Spaniards at Cajamarca
    explanation: Accounts differ slightly; all agree the Spanish force was fewer than two hundred men, horse and foot.
    sources: [rah-pizarro, maccormack-atahualpa]
    status: disputed
  - value: c. 2,000
    label: People killed in the square of Cajamarca
    explanation: >-
      The estimate of Francisco de Xerez, Pizarro’s secretary, who also wrote that the Inca’s people
      raised no weapons. No independent count exists.
    sources: [xerez-relacion]
    status: disputed
  - value: 26 Jul 1533
    label: Atahualpa is executed
    explanation: Garrotted at Cajamarca after receiving baptism to avoid being burnt.
    sources: [rah-pizarro]
    status: verified
  - value: 18 Jan 1535
    label: Lima is founded
    explanation: As the Ciudad de los Reyes, capital of Pizarro’s governorship of New Castile.
    sources: [rah-pizarro]
    status: verified

myths:
  - claim: A handful of Spaniards with guns and horses conquered the Inca Empire.
    status: legend
    explanation: >-
      Pizarro’s men exploited an empire divided by a war of succession, and many Andean peoples —
      Huancas and Chachapoyas among them — sided with the Spaniards against Cuzco’s rule. Nor was
      Cajamarca the end: Manco Inca’s rising of 1536 besieged Cuzco and Lima, and he and his followers
      then held out in Vilcabamba.
    sources: [rah-pizarro, maccormack-atahualpa]
  - claim: On the island of Gallo, Pizarro drew a line in the sand and thirteen men crossed it.
    status: disputed
    explanation: >-
      That thirteen men stayed with Pizarro in 1527 is documented, and the Crown later rewarded them.
      The dramatic line drawn with a sword is a story in which, as the Real Academia de la Historia’s
      biography puts it, history is mixed with legend.
    sources: [rah-pizarro]

otherSide:
  body: >-
    Cajamarca was a planned ambush on a retinue that, by the Spaniards’ own account, did not fight
    back. Captives were handed out as servants, Atahualpa was executed after paying his ransom, and
    Andean gold and silverwork was melted down and shared out, with the Crown taking its fifth. The
    conquest depended on Andean politics — a war of succession and peoples such as the Huancas and
    Chachapoyas who sided with the Spaniards against Cuzco. Pizarro then granted Andean people to
    his followers in encomienda, as tribute payers and labourers. Over the following century the
    Indigenous population of Peru collapsed; historians debate the weight of epidemics against war,
    destruction and oppression, but the collapse itself is not in doubt. Andean resistance continued,
    from Manco Inca’s siege of Cuzco to his retreat to Vilcabamba.
  sources:
    [xerez-relacion, rah-pizarro, maccormack-atahualpa, mccaa-smallpox, cook-demographic-collapse]

