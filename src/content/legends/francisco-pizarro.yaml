tagline: An illiterate soldier from Trujillo seized an emperor in an ambush — inside an Andean world already torn by civil war.
hook: >-
  Late on 16 November 1532, fewer than two hundred Spaniards hid in the buildings around the great
  square of Cajamarca. Atahualpa, fresh from victory in a war of succession, was carried in on a
  litter amid thousands of attendants. Within about half an hour, by the account of Pizarro’s own
  secretary, some two thousand of them lay dead and the Inca was a prisoner.
mainAchievement: Capture of Atahualpa at Cajamarca, 1532; foundation of Lima, 1535
