# SOURCED DRAFT — researched 2026-11-02 from the RAH Diccionario Biográfico entry (Hugo O'Donnell)
# and the Revista General de Marina monograph "500 años del nacimiento de don Álvaro de Bazán"
# (August–September 2026). Fleet sizes conflict and are given as ranges. The 1583 landing date
# differs between the RAH (surrender on 23 July) and the RGM (landing on 26 July). The RGM is
# followed for the landing. Research note: production/alvaro-de-bazan/research.md

