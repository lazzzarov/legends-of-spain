tagline: Fleet, troops and landing craft, welded into a single blow.
hook: >-
  Off the Azores on 26 July 1582, Álvaro de Bazán faced a French fleet that outnumbered his own,
  while his reinforcements were still at sea. After some five hours of gunfire and boarding, the
  French flagship surrendered. The next year he came back with flat-bottomed landing barges
  whose bows dropped into ramps, and took Terceira from the sea.
mainAchievement: Commanded the reserve at Lepanto (1571) and conquered the Azores (1582–1583)
keyEvent:
  year: 1583
  label: The landing on Terceira, in the Azores
  sources: [rah-bazan, rgm-gonzalez-molina]
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Álvaro de Bazán was born in Granada on 12 December 1526. His father, also Álvaro, commanded
      Spain’s galleys and built ships of his own design. At nine the boy was made perpetual governor
      of Gibraltar’s castle, under his father’s supervision. Still in his teens, he was aboard his
      father’s flagship at the battle of Muros in 1544, and was then left in command of the whole
      squadron while his father went ashore.
    sources: [rah-bazan]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      For years he hunted corsairs and escorted the treasure fleets home. In 1565, with Malta
      under Ottoman siege, he proposed a bold plan to the commander, García de Toledo: take only the
      best galleys, crammed with soldiers, and dash across the channel. It worked, and the relief force
      landed. In 1569 Philip II made him marquis of Santa Cruz.
    sources: [rah-bazan]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      At Lepanto, on 7 October 1571, Bazán commanded the reserve. Before the battle, when the Venetian
      commander hanged an Italian captain without authority, Bazán argued in council that the alliance must
      hold. During it he sent his brother Alonso with ten galleys to rescue the right wing. He led
      another ten into the centre to relieve Don John’s flagship, capturing an Ottoman galley crewed
      by janissaries.
    sources: [rah-bazan, rgm-machado-lepanto]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      In 1582 Philip II sent him to the Azores, the last stronghold of the Portuguese claimant Dom
      António. Off São Miguel on 26 July he defeated Filippo Strozzi’s larger French fleet. In 1583
      he returned with galleys and purpose-built landing barges. On 26 July his troops stormed the
      beach of las Molas, on Terceira, and entered Angra the next day. Within weeks the islands had
      surrendered.
    sources: [rah-bazan, rgm-gonzalez-molina]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Philip II made him a Grandee of Spain. From 1586 he planned an invasion of England, but delays
      kept the fleet in Lisbon, where typhus broke out. Visiting the sick, Bazán caught it and died on
      9 February 1588, just as he was being replaced in command. He never sailed with the Armada.
      Cervantes called him a “thunderbolt of war, father of soldiers”.
    more: >-
      He lies in the chapel of the palace he built at Viso del Marqués, in La Mancha. Since 1948
      the palace has housed the Spanish Navy’s historical archive, the Archivo-Museo Don Álvaro de
      Bazán. In 2026 the Navy’s Revista General de Marina devoted an anniversary issue to him and
      analysed the Terceira landing as an early amphibious operation. The Cervantes phrase is translated from the RAH biography’s
      quotation.
    sources: [rah-bazan, rgm-anca-palacio, rgm-gonzalez-molina]
    status: verified

facts:
  - value: '7 Oct 1571'
    label: Lepanto
    explanation: Bazán commands the Holy League’s reserve, sending reinforcements first to the right wing and then to the centre.
    sources: [rah-bazan, rgm-machado-lepanto]
    status: verified
  - value: 'c. 25 vs 30–60+'
    unit: ships
    label: Off São Miguel, 26 July 1582
    explanation: >-
      The RGM monograph gives Bazán about 25 ships against more than 60 French vessels of all sizes.
      The RAH counts thirty large French ships and agrees the French fleet was the stronger.
    sources: [rgm-gonzalez-molina, rah-bazan]
    status: disputed
  - value: '98'
    unit: ships
    label: The 1583 invasion force
    explanation: >-
      With more than 8,000 Spanish, German and Italian soldiers, 12 galleys and seven flat-bottomed
      landing barges. These are the RGM’s figures. The RAH gives no totals, and other accounts vary.
    sources: [rgm-gonzalez-molina]
    status: disputed
  - value: '9 Feb 1588'
    label: Death in Lisbon
    explanation: Of typhus caught while visiting sick sailors, months before the Armada sailed.
    sources: [rah-bazan, rgm-gonzalez-molina]
    status: verified

myths:
  - claim: If Bazán had lived, the Armada of 1588 would have succeeded.
    status: legend
    explanation: >-
      This is a counterfactual, not a fact. Bazán had planned an invasion, but his fleet was already
      delayed and stricken with typhus, and Philip II had replaced him before he died. No one can know
      how he would have fared against the English fleet and the weather of 1588. His real record is
      remarkable enough.
    sources: [rah-bazan, rgm-gonzalez-molina]
  - claim: The executions after the 1582 battle were Bazán’s own cruelty.
    status: disputed
    explanation: >-
      French historians in particular have blamed Bazán. But Spain and France were not formally at
      war, and Philip II’s instructions ordered that foreigners captured be hanged as pirates. Bazán
      carried out an order rather than inventing a punishment, though he still bears responsibility
      for carrying it out.
    sources: [rah-bazan, rgm-gonzalez-molina]

otherSide:
  body: >-
    The 1582 victory ended in mass executions. Because France and Spain were not formally at war, the
    French prisoners were treated as pirates, as the king had ordered. At Vila Franca on São Miguel,
    some eighty noblemen and gentlemen were beheaded and more than three hundred soldiers and sailors
    over seventeen were hanged. Lepanto was a coalition victory under Don John of Austria, shared
    with Venetian and Genoese squadrons. The Azores campaign was fought by Spanish, German and
    Italian troops against Portuguese islanders loyal to Dom António and their French allies. Bazán’s
    galleys ran on forced labour: captured English sailors went to the oars in 1562, and the 1576
    raid on Kerkennah brought back 1,200 slaves. A family memorial written by his granddaughter
    boasts of 2,500 people enslaved on Terceira and Faial. It is a celebratory source, but it shows
    the human cost behind the glory.
  sources: [rah-bazan, rgm-gonzalez-molina]

