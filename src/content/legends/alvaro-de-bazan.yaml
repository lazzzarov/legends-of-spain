comic:
  status: draft
  panels:
    - caption: Granada, 1526. Álvaro de Bazán is born into a family of seafarers and shipbuilders.
      sources: [rah-bazan]
    - caption: Muros, 1544. Aged seventeen, he is left in command of his father’s squadron.
      sources: [rah-bazan]
    - caption: Lepanto, 7 October 1571. From the reserve, Bazán sends galleys wherever the line is breaking.
      sources: [rah-bazan, rgm-machado-lepanto]
    - caption: His own galley rescues Don John’s flagship and captures an Ottoman galley crewed by janissaries.
      sources: [rah-bazan]
    - caption: Off São Miguel, 26 July 1582. The French fleet is bigger, and Bazán’s reinforcements have not arrived.
      context: Sources put the fleets at about 25 Spanish ships against 30 to more than 60 French.
      sources: [rah-bazan, rgm-gonzalez-molina]
    - caption: 1583. Flat-bottomed barges with ramp bows, built in Seville for one purpose — putting soldiers ashore.
      sources: [rah-bazan, rgm-gonzalez-molina]
    - caption: Dawn, 26 July 1583. Towed by galleys, the barges head for the beach of las Molas on Terceira.
      sources: [rgm-gonzalez-molina]
    - caption: Lisbon, 1588. Bazán dies of typhus while preparing the fleet. He never sails with the Armada.
      sources: [rah-bazan, rgm-gonzalez-molina]

movie:
  title: From the Sea
  premise: An admiral who has spent his life at sea must take an island fortress no fleet alone can capture.
  conflict: >-
    Defeat a larger French fleet in the open Atlantic, then land an army on a defended coast without
    any doctrine for how to do it.
  challenge: Combining galleys, sailing ships, soldiers and new landing craft into a single operation.
  moments:
    - text: 7 October 1571. At Lepanto, Bazán throws his reserve galleys first to the right wing, then to Don John’s flagship.
      sources: [rah-bazan, rgm-machado-lepanto]
    - text: 26 July 1582. Outnumbered and without his reinforcements, Bazán’s fleet fights Strozzi’s off São Miguel and takes the French flagship.
      sources: [rah-bazan, rgm-gonzalez-molina]
    - text: 26 July 1583. Galleys bombard the shore and tow the landing barges towards the beach of las Molas. Angra falls the next day.
      sources: [rgm-gonzalez-molina]
  theme: Ingenuity under pressure, and the cost that victory imposes on the defeated.

places:
  - name: Palacio del Marqués de Santa Cruz
    relation: >-
      The palace Bazán began building in 1564. His remains lie in its chapel, and since 1948 it has
      housed the Spanish Navy’s historical archive, the Archivo-Museo Don Álvaro de Bazán.
    location: Viso del Marqués, Ciudad Real, Castile-La Mancha
    sources: [rah-bazan, rgm-anca-palacio]
  - name: Granada
    relation: Birthplace. He was born in his grandfather’s “casas grandes” beside the Darro, near the convent of Sancti Spiritus.
    location: Granada, Andalusia
    sources: [rah-bazan]
  - name: Beach of las Molas (probably today’s Baía das Mós)
    relation: >-
      The beach between Praia and Angra chosen for the amphibious landing of 26 July 1583. Its
      identification with the modern Baía das Mós is likely but not confirmed.
    location: Terceira, Azores, Portugal
    sources: [rgm-gonzalez-molina]

