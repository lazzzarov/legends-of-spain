tagline: A colonial official from Mexico City led the voyage that founded Spanish Manila, and with it more than two centuries of galleons crossing the Pacific.
hook: >-
  Four days out from the port of Navidad in November 1564, Legazpi called his captains, pilots and
  friars aboard the San Pedro. In front of a notary he opened the sealed orders he had carried from
  Mexico. They named the Philippines, not New Guinea. Andrés de Urdaneta, the expedition’s great
  navigator, had argued against that course and was deeply displeased.
mainAchievement: Founded the Spanish settlements of Cebu (1565) and Manila (1571)
keyEvent:
  year: 1565
  label: The return route across the Pacific is found
  sources: [rah-urdaneta, rah-legazpi]
