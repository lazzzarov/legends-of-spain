comic:
  status: draft
  panels:
    - caption: Zumarraga, Gipuzkoa. Miguel López de Legazpi is born in the family tower house around 1502.
      sources: [euskadi-torre-legazpi, rah-legazpi]
    - caption: Mexico City. For more than thirty years he works as a notary, council secretary, alcalde and official.
      sources: [rah-legazpi]
    - caption: November 1564. Four days out of Navidad, Legazpi opens the sealed orders. Their destination is the Philippines.
      context: Urdaneta had argued for New Guinea.
      sources: [rah-legazpi]
    - caption: Cebu, April 1565. Troops land, the people flee and about a hundred houses burn.
      note: In one surviving house the Spaniards find the Santo Niño image that Magellan’s expedition had left in 1521.
      sources: [blair-robertson-v2, rah-legazpi]
    - caption: 1 June 1565. The San Pedro sails north-east with Urdaneta as navigator, looking for a way back to America.
      sources: [rah-urdaneta, rah-legazpi]
    - caption: 8 October 1565. The ship reaches Acapulco with many of its crew sick or dead. The return route has been found.
      sources: [rah-urdaneta, blair-robertson-v2]
    - caption: May 1571. Through two interpreters, Legazpi negotiates with Rajah Matanda, Rajah Soliman and Lakandula.
      sources: [rah-legazpi]
    - caption: 24 June 1571. Spanish Manila is formally founded on the site of Maynila.
      sources: [rah-legazpi]

movie:
  title: The Sealed Orders
  premise: An ageing colonial official opens his orders at sea and must build a colony on the far side of an ocean no ship has yet sailed back across.
  conflict: Keep a hungry expedition alive among islanders who have good reason to distrust it, while a rival empire claims the same islands.
  challenge: Holding on long enough for one ship to find the way home, and facing what that holding-on costs others.
  moments:
    - text: November 1564. Four days out, the sealed instructions are opened and name the Philippines, against Urdaneta’s wishes.
      sources: [rah-legazpi]
    - text: Cebu, April 1565. The landing, the burning houses, and the Santo Niño found in the ruins.
      sources: [blair-robertson-v2, rah-legazpi]
    - text: Manila, 24 June 1571. Spanish Manila is founded on the site of Rajah Soliman’s town.
      sources: [rah-legazpi, blair-robertson-v3]
  theme: Building something that lasts, and the cost to those who were already there.

