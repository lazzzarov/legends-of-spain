chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Legazpi was born in Zumarraga, in Gipuzkoa, around 1502. As a younger son he had no claim to
      the family estate, so after working as a notary he left for New Spain around 1528. In Mexico
      City he became secretary of the city council, then alcalde, and held a senior post at the mint.
      From 1536 to 1543 he was secretary to the Inquisition tribunal, which tried Indigenous lords for
      keeping their old religion.
    sources: [rah-legazpi, euskadi-torre-legazpi]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In 1559 Philip II ordered an expedition to the “Western Islands” across the Pacific. Spain had
      tried to reach them before, but no ship had ever found a way back east to America. The friar
      and navigator Andrés de Urdaneta was ordered to join. Legazpi was given command of four ships,
      which the viceroy said would carry about three hundred Spaniards, half soldiers and half
      sailors. They sailed from Navidad on 21 November 1564.
    sources: [rah-legazpi, rah-urdaneta, blair-robertson-v2]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      In the islands the Spaniards were short of food and met with mistrust. Portuguese raiders had
      attacked people there, and to the islanders the newcomers looked the same. Legazpi wrote that
      the chiefs of Bohol made friends but would sell them nothing. At Cebu in April 1565 he sent
      troops ashore. The people fled and about a hundred houses burned. On 8 May he founded the
      settlement of San Miguel there.
    sources: [blair-robertson-v2, rah-legazpi]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      On 1 June 1565 Legazpi sent the San Pedro back to New Spain under his grandson Felipe de
      Salcedo, with Urdaneta as navigator. They sailed north-east to around forty degrees north,
      caught the westerly winds and reached Acapulco on 8 October. The way back across the Pacific
      had been found. For the next two and a half centuries, until 1815, galleons used that route to
      link Asia with the Americas.
    sources: [rah-urdaneta, rah-legazpi, blair-robertson-v2]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Legazpi stood his ground at Cebu when a Portuguese fleet challenged him in 1568, and later
      moved north. On 24 June 1571 he held the formal founding of Spanish Manila and set up its council.
      He died there on 20 August 1572. Manila became the Asian end of the galleon route to Acapulco, and
      the seat of a colonial government over much of the archipelago.
    more: >-
      Manila was not empty land. It was Maynila, a fortified trading town under Rajah Matanda and his
      nephew Rajah Soliman, with Lakandula ruling Tondo nearby. Chinese and Japanese traders lived
      there. In 1570 Legazpi’s field commander, Martín de Goiti, fought the town, which burned. In
      May 1571 Legazpi negotiated through two interpreters, and the three rulers agreed to become
      vassals of the Spanish crown. A month later he formally founded the Spanish city.
    sources: [rah-legazpi, pares-legazpi-pereira, blair-robertson-v3]
    status: verified

facts:
  - value: c. 1502–1510
    label: Year of birth
    explanation: >-
      The Real Academia de la Historia gives 12 June 1502, and the Basque government gives
      “around 1502”. Older works often say about 1510.
    sources: [rah-legazpi, euskadi-torre-legazpi]
    status: disputed
  - value: '4'
    unit: ships
    label: In the 1564 fleet
    explanation: >-
      Two galleons and two smaller pataches. The viceroy expected them to carry about three hundred
      Spaniards, half soldiers and half sailors, plus six Augustinian friars.
    sources: [blair-robertson-v2]
    status: verified
  - value: '16'
    label: Deaths on the first return voyage
    explanation: >-
      About 210 people sailed home on the San Pedro in 1565. Sixteen died, and only ten to eighteen
      were fit to work when they neared Mexico.
    sources: [blair-robertson-v2, rah-urdaneta]
    status: verified
  - value: 24 Jun 1571
    label: Spanish Manila is formally founded
    explanation: Four days later Legazpi created its city council, with two alcaldes and twelve councillors.
    sources: [rah-legazpi]
    status: verified
  - value: '1815'
    label: The last year of the Manila–Acapulco galleon
    explanation: The route opened by Urdaneta’s 1565 voyage stayed in use for two and a half centuries.
    sources: [rah-legazpi]
    status: verified

myths:
  - claim: Legazpi found the route back across the Pacific.
    status: legend
    explanation: >-
      Legazpi stayed in Cebu. The return route, the tornaviaje, was sailed in 1565 by the San Pedro
      under his grandson Felipe de Salcedo, with the Augustinian friar Andrés de Urdaneta as its real
      navigator.
    sources: [rah-urdaneta, rah-legazpi]
  - claim: Legazpi won the Philippines without bloodshed.
    status: legend
    explanation: >-
      He did rely heavily on negotiation and treaties. But his forces burned and sacked villages on
      Guam in January 1565 and took Cebu by landing troops, and around a hundred houses burned. In
      1570 his field commander fought Maynila, and the town was destroyed by fire.
    sources: [blair-robertson-v2, blair-robertson-v3, rah-legazpi]

otherSide:
  body: >-
    To the people of the islands this was an invasion. In the 1565 treaty, Tupas and the chiefs of
    Cebu became vassals of Castile. They had to hand over runaway slaves and could not enter the
    Spanish camp armed, and they were promised a year’s grace before paying tribute. Reinforcements soon
    brought authority to set up encomiendas, grants of Filipino labour and tribute to Spanish settlers. Spanish
    reports call islanders treacherous, and the 1903 English editors kept that tone, but the
    officials themselves traced the hostility to Portuguese massacres. Soliman of Maynila
    resisted, and his town was burned. Legazpi depended on Urdaneta, Salcedo, Goiti, interpreters and
    Cebuano and Panayan fighters in their own boats. In Mexico he had served the Inquisition against
    Indigenous lords.
  sources: [blair-robertson-v2, blair-robertson-v3, rah-legazpi, rah-urdaneta]

