    type: institutional
    notes: >-
      Gives Pasajes, II.1689 – Cartagena de Indias, 7.IX.1741; details each wound and the premature
      medals. Its totals (more than 170 ships, 31,000 men; “each Spaniard defeated ten Englishmen”)
      are at the high end and are treated here as disputed.
