tagline: Six warships, layered forts and a city that would not fall.
hook: >-
  On 15 March 1741 the walls of Cartagena de Indias sighted Admiral Edward Vernon’s fleet — well over
  a hundred sail, carrying tens of thousands of sailors and soldiers. Against it the port had six
  Spanish warships under Blas de Lezo, a few thousand regulars and militiamen, and a chain of forts.
  The siege would last two months.
mainAchievement: Shared the defence of Cartagena de Indias, 1741
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Blas de Lezo y Olavarrieta was born in Pasajes (Pasaia), Gipuzkoa, in February 1689, into a
      family of the minor nobility with ties to the sea. In 1702 he joined the French navy as a
      midshipman — the two crowns’ fleets were then united under Philip V. At his first battle,
      Vélez-Málaga in 1704, a cannonball tore off his left leg below the knee.
    sources: [rah-lezo]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      More wounds came with promotion. He lost the sight of his left eye fighting Savoyard ships, and
      in 1714, at the siege of Barcelona, a musket ball left his right arm useless. Yet he kept
      rising: he commanded the South Sea squadron off Peru, destroyed an Algerian squadron at
      Mostaganem in 1733 and became a lieutenant general. In March 1737 he reached Cartagena de Indias.
    sources: [rah-lezo]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      Cartagena guarded the way into New Granada. When the War of Jenkins’ Ear broke out in 1739,
      Britain sent Vice-Admiral Edward Vernon to strike at Spain’s Caribbean ports. The fleet that
      appeared in March 1741 numbered roughly 115 to 190 vessels, by different counts, with tens of
      thousands of sailors, soldiers and colonial troops. The defenders had six ships of the line and
      a few thousand men.
    sources: [rah-lezo, rah-eslava, jauregui-lobera-2019]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      The defence came in layers. The forts at Bocachica held for more than two weeks; then Spanish
      ships were sunk to block the channel, the British broke through, and Vernon sent news of victory
      home. But on 20 April their assault on the Castillo de San Felipe de Barajas failed — the ladders
      were too short for the walls. With disease killing thousands, the British sailed away on 20 May.
    sources: [rah-lezo, rah-eslava]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Victory brought Lezo no peace. He and Viceroy Sebastián de Eslava had quarrelled throughout the
      siege, and Eslava asked the king to punish him. Lezo died in Cartagena on 7 September 1741; a
      royal order removing him from command was dated weeks later. Eslava was made Marquis of la Real
      Defensa. Lezo’s reputation was restored only years afterwards, through his son’s efforts.
    more: >-
      The victory was collective. Eslava, who held supreme command, oversaw the forts and supplies; the
      engineer Carlos Desnaux defended San Luis de Bocachica and then San Felipe; regular battalions,
      local militia, companies of pardos and some 600 Indigenous troops manned the walls. Lezo’s ships
      and seamanship bought time — and time, in a fever-ridden climate, was the defenders’ best weapon.
    sources: [rah-lezo, rah-eslava]
    status: verified

facts:
  - value: '6'
    unit: warships
    label: Lezo’s squadron
    explanation: Six ships of the line, with about a thousand soldiers and sailors aboard, according to the RAH.
    sources: [rah-lezo, rah-eslava, museo-naval-lezo-portrait]
    status: verified
  - value: c. 115–200
    unit: vessels
    label: Vernon’s fleet
    explanation: >-
      Counts vary with what is included: 115 sail (RAH, Eslava), more than 170 (RAH, Lezo), nearly
      200 (Jáuregui-Lobera). Popular figures are often inflated.
    sources: [rah-eslava, rah-lezo, jauregui-lobera-2019]
    status: disputed
  - value: c. 24,000–31,000
    unit: men
    label: Sailors, soldiers and colonial troops in the attack
    explanation: >-
      Estimates range from about 24,000 soldiers to some 31,000 men in all. Defenders are put at
      between about 2,000 and 3,600, plus the crews of Lezo’s ships.
    sources: [jauregui-lobera-2019, rah-eslava, rah-lezo]
    status: disputed
  - value: 20 Apr 1741
    label: The assault on San Felipe fails
    explanation: The British storming columns found their ladders too short for the walls and were driven back with heavy losses.
    sources: [rah-lezo, rah-eslava]
    status: verified
  - value: 20 May 1741
    label: The British withdraw
    explanation: After two months, with combat losses and disease crippling the expedition.
    sources: [rah-lezo, rah-eslava]
    status: verified

myths:
  - claim: Lezo alone inflicted the greatest naval defeat in British history.
    status: legend
    explanation: >-
      The defence was shared with Viceroy Eslava, the engineers, the garrison and the militia, and
      tropical disease devastated the attackers. “Greatest defeat ever” is rhetoric: comparisons across
      centuries depend entirely on the criteria chosen, and the force figures behind them are disputed.
    sources: [rah-eslava, rah-lezo, jauregui-lobera-2019]
  - claim: Lezo lost a leg, an eye and an arm.
    status: legend
    explanation: >-
      Partly true. He lost his left leg below the knee in 1704 and the sight of his left eye in a
      later action, but his right arm was not lost: a musket ball in 1714 left it useless.
    sources: [rah-lezo]

otherSide:
  body: >-
    Popular retellings sometimes make Lezo the lone genius and Eslava the obstacle. The record is
    messier: the two quarrelled bitterly, yet both exercised essential authority, and Eslava overruled
    Lezo over sinking the ships at Bocachica. The defence also depended on engineers, regular troops,
    Creole militia, pardo companies and Indigenous soldiers. The war itself had commercial roots in
    the slave trade: the South Sea Company, which held the asiento for supplying enslaved Africans to
    Spanish America, pushed for it. Vernon’s army included North American colonists and about 2,000
    Black machete-men from Jamaica’s sugar plantations. The human cost was enormous, above all from
    dysentery, fever and scurvy; one RAH estimate puts British losses near 18,000, but totals remain
    disputed.
  sources: [rah-lezo, rah-eslava]

