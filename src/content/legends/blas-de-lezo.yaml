sources:
  - id: rah-lezo
    title: Lezo y Olavarrieta, Blas de
    author: Gonzalo M. Quintero Saravia
    institution: Real Academia de la Historia, Diccionario Biográfico Español (Historia Hispánica)
    url: https://historia-hispanica.rah.es/biografias/25445
