comic:
  status: draft
  panels:
    - caption: Vélez-Málaga, 1704. A cannonball takes the left leg of a fifteen-year-old midshipman, Blas de Lezo.
      sources: [rah-lezo]
    - caption: March 1737. Lezo arrives at Cartagena de Indias and finds its forts in poor repair and its garrison thinned by disease.
      sources: [rah-lezo]
    - caption: 15 March 1741. From the walls, the defenders sight Vernon’s fleet.
      sources: [rah-lezo, rah-eslava]
    - caption: Bocachica holds for more than two weeks. Then the Spanish ships are sunk to block the channel — and the British force their way in.
      sources: [rah-lezo, rah-eslava]
    - caption: Certain of victory, Vernon sends the news to England. Medals are struck showing Lezo kneeling to surrender.
      note: Medals of this kind survive in the Royal Museums Greenwich, the Museo Naval in Madrid and the Museo Nacional de Colombia.
      sources: [rah-lezo, rah-eslava, rmg-vernon-medal]
    - caption: 20 April 1741. The storming columns reach San Felipe de Barajas at dawn. Their ladders are too short.
      sources: [rah-lezo, rah-eslava]
    - caption: Fever, dysentery and scurvy finish what the walls began. On 20 May the British sail away.
      sources: [rah-lezo, rah-eslava]
    - caption: 7 September 1741. Lezo dies in Cartagena. His grave is unknown.
      sources: [rah-lezo]

movie:
  title: The Key to the Indies
  premise: A battered veteran and a sceptical viceroy must hold a fortress city against the largest fleet ever sent against the Americas.
  conflict: Buy time behind layered defences until the attackers break — or the city falls.
  challenge: Fighting a far larger enemy while fighting each other.
  moments:
    - text: 15 March 1741 — Vernon’s fleet appears off Cartagena de Indias.
      sources: [rah-lezo, rah-eslava]
    - text: Early April 1741 — Bocachica falls and Vernon sends word of victory to England; medals are struck.
      sources: [rah-lezo, rah-eslava, rmg-vernon-medal]
    - text: 20 April 1741 — the assault on San Felipe de Barajas fails at the foot of its walls.
      sources: [rah-lezo, rah-eslava]
  theme: Victory has many authors — and time can be a weapon.

