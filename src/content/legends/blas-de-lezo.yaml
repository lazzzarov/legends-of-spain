    type: institutional
    notes: Gives 115 sail, 37 ships of the line, 15,000 sailors and 12,000 soldiers against 3,200 defenders; British losses near 18,000.
  - id: jauregui-lobera-2019
    title: 'Navegación e historia de la ciencia: Las heridas y pesares de Don Blas de Lezo y Olavarrieta (“Mediohombre”)'
    author: Ignacio Jáuregui-Lobera
