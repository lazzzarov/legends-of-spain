tagline: He turned a scattered guerrilla band into an army with its own taxes, courts and schools, and then tried to overthrow his king.
hook: >-
  On 29 March 1810 French troops surprised the Navarrese guerrillas at Labiano and captured their
  young leader, Javier Mina. His uncle Francisco Espoz slipped away with six men. They chose him as
  their chief, although he had never commanded anyone. Within weeks he had talked some four hundred
  more guerrillas into following him.
mainAchievement: Built and led the Navarre Division against the French occupation, 1810–1814
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Francisco Espoz y Mina was born on 17 June 1781 in Idocin, Navarre, into a family of well-off
      farmers. When French troops took control of Pamplona in February 1808, he did not rush to join
      the bands forming in the countryside. In February 1809 he enlisted in a volunteer battalion at
      Jaca. When its citadel surrendered, he climbed down the walls, went home and joined the
      guerrilla band of his nephew Javier Mina as an ordinary soldier.
    sources: [rah-espoz-y-mina]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      On 29 March 1810 the French surprised the band at Labiano and captured Javier Mina. Espoz
      escaped with six men, who chose him as leader although he had never held command. At Lacunza he
      persuaded some 400 more guerrillas to follow him. He then fought on two fronts: against the
      French, and against rival bands that were closer to banditry. In July 1810 he captured one
      rival chief, Echeverría, at Estella and had him shot.
    sources: [rah-espoz-y-mina]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      Espoz answered scarcity with administration. To pay, clothe and feed his men without
      plundering, he set up customs posts on roads and frontier passes and collected tithes and state
      taxes. He also ran mobile arms workshops and hospitals, and even set up courts. Priests and
      mayors were made to send him intelligence, carried by couriers who passed messages on by word of
      mouth. After his infantry was almost destroyed at Belorado in 1810, he drilled his men and
      founded officer schools.
    sources: [rah-espoz-y-mina]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      His trademark was the ambush. Before dawn on 25 May 1811 he hid his battalions on both sides of
      the Arlabán pass to strike a French convoy. Each man had a single cartridge: one volley, then
      the bayonet. Of an escort of about 1,200, only some 400 got back to Vitoria, and around 1,000
      Spanish and British prisoners were freed. In 1813 Wellington used Espoz to pin down French
      forces before the battle of Vitoria.
    sources: [rah-espoz-y-mina]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Peace brought no reward. The king refused him the viceroyalty of Navarre and sent his men home.
      On the night of 25–26 September 1814 Espoz marched on Pamplona’s citadel in a failed coup; his
      officers refused to follow, and he fled to France. He returned after the liberal revolution of
      1820, fought the absolutists in Catalonia and, after years in exile, commanded against the
      Carlists. He died in Barcelona on 24 December 1836.
    more: >-
      His 1814 rising is often counted as the first of the military pronunciamientos that marked
      nineteenth-century Spain. His RAH biographer is sceptical about its motives: Espoz had shown
      little attachment to the 1812 Constitution before then, and his troops never swore to it during
      the war. Later he led professionalised former guerrillas into the liberal officer corps. He is
      buried in the cloister of Pamplona Cathedral, and his widow, Juana de Vega, was made Countess of
      Espoz y Mina in 1842.
    sources: [rah-espoz-y-mina, portillo-esdaile-2007]
    status: verified

facts:
  - value: 29 Mar 1810
    label: Takes command
    explanation: After the French capture Javier Mina at Labiano, the survivors choose Espoz as their leader.
    sources: [rah-espoz-y-mina]
    status: verified
  - value: 3,000–11,000
    label: Men under his command, 1810–1814
    explanation: These are his own figures, for the end of 1810 and for 1814. Navarre’s own 1817 returns counted about 3,500 Navarrese volunteers, so many of his men must have come from neighbouring regions or have been French deserters.
    sources: [rah-espoz-y-mina]
    status: disputed
  - value: '40,000'
    label: French casualties he claimed
    explanation: His service record and memoirs claim about 40,000 French losses, 14,000 of them prisoners. His RAH biographer says these numbers should be treated with caution.
    sources: [rah-espoz-y-mina, espoz-memorias]
    status: disputed
  - value: 14 Dec 1811
    label: “War to the death”
    explanation: In answer to French decrees against guerrillas’ families, he declares war without quarter and orders captured French soldiers to be hanged.
    sources: [rah-espoz-y-mina]
    status: verified
  - value: 25–26 Sep 1814
    label: The Pamplona rising
    explanation: An improvised attempt to seize Pamplona’s citadel against Ferdinand VII. It fails, and Espoz flees to France.
    sources: [rah-espoz-y-mina, enciclopedia-catalana]
    status: verified

myths:
  - claim: The guerrilla war against Napoleon was a spontaneous rising of the whole Spanish people.
    status: legend
    explanation: >-
      Modern historians, notably Charles Esdaile, show that most people tried to stay out of the war.
      Those who joined often had concrete motives such as hunger or the passage of armies, and some
      bands were little more than bandits. Espoz y Mina himself built a structured force that taxed,
      policed and compelled the villages it controlled to supply intelligence.
    sources: [portillo-esdaile-2007, rah-espoz-y-mina]
  - claim: Guerrillas like Espoz y Mina drove the French out of Spain on their own.
    status: legend
    explanation: >-
      Guerrillas wore down French forces and tied up troops, but they could not defeat regular armies
      in open battle. The decisive victory at Vitoria in 1813 was won by Wellington’s Anglo-Spanish-
      Portuguese army, which Espoz supported by pinning down French forces.
    sources: [portillo-esdaile-2007, rah-espoz-y-mina]

otherSide:
  body: >-
    The romantic image of the guerrilla as the people in arms does not survive close study. Modern
    historiography stresses that most Spaniards tried to stay out of the war, that some bands were
    bandits, and that the regular Allied armies were decisive. Espoz y Mina was exceptional because he
    imposed order, but that order rested on coercion. He made priests and mayors inform for him,
    collected taxes and tithes (possibly double what the French collected) and had at least one rival
    guerrilla chief shot. The war in Navarre was brutal on both sides. In 1811 French decrees made
    guerrillas’ families responsible for their conduct, took hostages and put prices on the leaders’
    heads. Espoz answered with “war to the death”, ordering prisoners to be hanged, although 300
    gendarmes captured soon afterwards were spared. His casualty figures come largely from his own
    memoirs. His later career repeated the pattern. In Catalonia in 1822 he razed Castellfollit. In
    Navarre in 1834 he burned Lekaroz and had three of its inhabitants shot. As captain general of
    Catalonia in 1836, he was held responsible for the reprisal execution of the Carlist leader
    Ramón Cabrera’s mother, which caused widespread revulsion.
  sources: [rah-espoz-y-mina, portillo-esdaile-2007, enciclopedia-catalana]

