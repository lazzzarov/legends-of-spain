movie:
  title: Behind the Lines
  premise: A farmer with no experience of command inherits a broken guerrilla band and turns it into a shadow state.
  conflict: Survive French columns many times his strength while feeding, paying and disciplining an army that officially does not exist.
  challenge: The methods that hold his force together, including taxation, informers, executions and reprisals, are the same ones he is fighting against.
  moments:
    - text: Labiano, 29 March 1810 — Javier Mina is captured, and six survivors choose Espoz as their leader.
      sources: [rah-espoz-y-mina]
    - text: Arlabán pass, 25 May 1811 — a dawn ambush on a French convoy frees around a thousand prisoners.
      sources: [rah-espoz-y-mina]
    - text: Pamplona, 25–26 September 1814 — the guerrilla general turns against his king, and his own officers refuse to follow.
      sources: [rah-espoz-y-mina]
  theme: The war that makes a hero also teaches him its cruelties.

