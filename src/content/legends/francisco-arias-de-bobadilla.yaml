tagline: Trapped by deliberate floods, his men held out — and then the water froze.
hook: >-
  Late in 1585 the Dutch cut the dykes of the Bommelerwaard and drove Francisco Arias de
  Bobadilla’s tercio onto the high ground at Empel, ringed by floodwater and a rebel fleet, short
  of food in the winter cold. Every attempt to break out failed. Then, on the night of 7 December,
  a hard frost set in.
mainAchievement: Empel, 7–8 December 1585
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Francisco Arias de Bobadilla was born in Madrid in 1537, a younger son of the noble house of
      Puñonrostro. He began as a cavalry captain in Milan in the early 1560s and marched to the
      Netherlands with the Duke of Alba’s army in 1567. At the siege of Mons in 1572 his courage so
      impressed Alba that he was sent to carry the news of victory to Philip II in person.
    sources: [rah-arias-de-bobadilla]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      By 1585 Bobadilla was a maestre de campo — commander of a tercio — in the Army of Flanders,
      fighting the revolt of the Dutch provinces. That November his men crossed the Maas into the
      Bommelerwaard, an island between the Maas and the Waal, in search of winter quarters. Then
      Philip of Hohenlohe arrived from Dordrecht with a fleet of the States and cut the dykes in
      several places. The island began to drown.
    sources: [rah-arias-de-bobadilla, bossche-encyclopedie-empel, army-ferrer-dalmau-2015]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      The Spaniards fell back across the Maas and were stranded at Empel, on higher ground by the
      village church. Floodwater surrounded them, and Hohenlohe’s ships blocked the way to
      ’s-Hertogenbosch. Food was short and winter had come. Every attempt to escape or to bring in
      help failed. Spanish tradition adds that a soldier digging a trench unearthed a Flemish panel
      painting of the Immaculate Conception.
    sources: [bossche-encyclopedie-empel, army-ferrer-dalmau-2015, army-infanteria-2019]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      On the night of 7 December 1585 a bitter north-easterly wind brought a hard frost. Fearing
      that his ships would be frozen in, Hohenlohe pulled back towards open water, and the trapped
      soldiers got clear to ’s-Hertogenbosch before the thaw. Spanish accounts describe them crossing
      the ice at dawn and falling on the enemy fleet. It was 8 December — the feast of the Immaculate
      Conception.
    sources:
      [bossche-encyclopedie-empel, army-ferrer-dalmau-2015, emad-empel-2018, army-infanteria-2025]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      In 1588 Philip II made Bobadilla the Duke of Medina Sidonia’s adviser on fighting in the
      Armada. He later became Count of Puñonrostro and a member of the Council of War, and died in
      Madrid in 1610. Empel lived on as devotion: Spanish units venerated the Immaculate Conception
      as their patroness, and in 1892 the queen regent made her patroness of the whole Spanish
      infantry.
    more: >-
      Empel is best told on three levels. Verified: Bobadilla’s men were trapped by deliberate
      flooding, a sudden frost changed the situation, and they escaped. Traditional: a soldier found
      an image of the Virgin while digging in. Devotional: the belief that the frost was a miracle —
      a matter of faith and institutional memory, not something military history can test.
      Strikingly, the Real Academia de la Historia’s biography of Bobadilla does not mention Empel at
      all; it dwells on Mons, the Azores, the Armada and Aragon.
    sources: [rah-arias-de-bobadilla, bossche-encyclopedie-empel, army-infanteria-2019]
    status: verified

facts:
  - value: 7–8 Dec 1585
    label: Trapped and freed at Empel
    explanation: The Spanish Army dates the episode to the night of 7 December and the morning of the 8th.
    sources: [army-infanteria-2025, emad-empel-2018, bossche-encyclopedie-empel]
    status: verified
  - value: '10'
    unit: ships
    label: The rebel fleet, by the Spanish Army’s count
    explanation: >-
      The Defence Staff gives Hohenlohe ten ships. Popular retellings give far larger fleets; no
      contemporary count was consulted for this page.
    sources: [emad-empel-2018]
    status: disputed
  - value: '1588'
    label: Adviser to the Armada’s commander
    explanation: Philip II named him adviser to the Duke of Medina Sidonia on matters of fighting.
    sources: [rah-arias-de-bobadilla]
    status: verified
  - value: '1892'
    label: Patroness made official
    explanation: >-
      A royal order of the queen regent (12 November 1892) made the Immaculate Conception patroness
      of the whole Spanish infantry. Units had honoured her unofficially since Empel.
    sources: [bossche-encyclopedie-empel, army-infanteria-2019, army-infanteria-2025]
    status: verified

myths:
  - claim: A miracle froze the river and saved the tercio.
    status: legend
    explanation: >-
      The flooding, the sudden frost and the escape are documented. The finding of the Marian image
      is a tradition, and the belief that the frost was divinely sent is a devotional reading. Both
      became central to Spanish military memory, but neither can be demonstrated historically.
    sources: [bossche-encyclopedie-empel, army-ferrer-dalmau-2015, army-infanteria-2019]
  - claim: The Immaculate Conception has officially been patroness of the Spanish infantry since 1585.
    status: legend
    explanation: >-
      The devotion among Spanish units goes back to Empel, but the official patronage of the whole
      infantry dates only from a royal order of 1892.
    sources: [army-infanteria-2019, army-infanteria-2025, bossche-encyclopedie-empel]

otherSide:
  body: >-
    Empel is remembered in Spain largely through devotion, and the devotional story has grown over
    time. A Dutch local-history study of the Empel chapel found no trace of the event in the parish’s
    old inventories or records until after the Second World War, and called a 1954 claim that a
    soldiers’ brotherhood was founded at Empel on 8 December 1585 plainly fanciful. The Real
    Academia de la Historia’s biography of Bobadilla passes over Empel entirely. The episode also
    belongs to a long war in which Spain was suppressing a revolt, and Bobadilla was a hard soldier:
    during the Armada he had a disobedient ship’s captain hanged, and in 1591–92 he urged exemplary
    punishment of the Aragonese rebels and carried out the arrest of the Justicia of Aragon, who
    was then executed.
  sources: [bossche-encyclopedie-empel, rah-arias-de-bobadilla]

