movie:
  title: The Night the Water Froze
  premise: A veteran commander and his men are trapped on a drowning island by an enemy who has turned the landscape itself into a weapon.
  conflict: Survive flood, hunger and an enemy fleet with no road out and no relief coming.
  challenge: Keeping a starving, soaked army together long enough for a chance that may never come.
  moments:
    - text: November 1585 — Hohenlohe cuts the dykes and the Bommelerwaard floods.
      sources: [bossche-encyclopedie-empel, army-ferrer-dalmau-2015]
    - text: Empel — the stranded tercio, ringed by water and ships, fails again and again to break out.
      sources: [bossche-encyclopedie-empel]
    - text: The night of 7 December — a hard frost; the enemy fleet withdraws and the soldiers escape across the ice.
      sources: [bossche-encyclopedie-empel, army-ferrer-dalmau-2015, emad-empel-2018]
  theme: Endurance — and how a lucky frost became an article of faith.

places:
  - name: Empel
    relation: >-
      Where Bobadilla’s men were stranded in December 1585. The parish church of St Landelinus
      (rebuilt in 1949 on a new site) has a side chapel to Our Lady of Empel with a 1950 triptych
      telling the story.
    location: ’s-Hertogenbosch, North Brabant, Netherlands
    sources: [bossche-encyclopedie-empel, emad-empel-2018]
  - name: Academia de Infantería
    relation: The Spanish infantry academy, which celebrates the Immaculate Conception as patroness and where Ferrer-Dalmau’s painting El milagro de Empel was presented in 2015.
    location: Toledo, Castile-La Mancha
    sources: [army-ferrer-dalmau-2015, army-infanteria-2025]
  - name: Madrid
    relation: Birthplace (1537) and place of death (1610).
    location: Madrid
    sources: [rah-arias-de-bobadilla]

related: [alvaro-de-bazan, antonio-de-leyva, francisco-de-sarmiento]

seo:
  description: Trapped by deliberate floods at Empel in 1585, Bobadilla’s men held out until the water froze. History, tradition and devotion, told apart.

