# SOURCED — researched 2026-11-02 (see production/francisco-arias-de-bobadilla/research.md).
# Three levels of claim are kept apart: verified (flooding, cold, escape), traditional (the
# finding of the Marian image) and devotional (the "miracle"). Awaiting human review.

