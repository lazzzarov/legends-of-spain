  panels:
    - caption: November 1585. Bobadilla’s men cross the Maas into the Bommelerwaard, looking for winter quarters.
      sources: [bossche-encyclopedie-empel]
    - caption: Hohenlohe’s fleet arrives from Dordrecht. The dykes are cut, and the water rises.
      sources: [bossche-encyclopedie-empel, army-ferrer-dalmau-2015]
    - caption: Stranded at Empel — floodwater all around, enemy ships on the river, little food, and winter coming on.
      sources: [bossche-encyclopedie-empel]
    - caption: Tradition says a soldier digging a trench strikes a wooden panel painted with the Immaculate Conception.
      note: This is a tradition, not a documented event.
      sources: [army-infanteria-2019, army-ferrer-dalmau-2015]
    - caption: The night of 7 December. A bitter north-easterly wind. The water begins to freeze.
      sources: [bossche-encyclopedie-empel]
