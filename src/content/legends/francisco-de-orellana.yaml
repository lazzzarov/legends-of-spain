movie:
  title: The River Will Not Let Us Go
  premise: A one-eyed captain sent to find food for a starving army is swept into a river no European has charted.
  conflict: Survive hunger, the current and the peoples whose lands they are passing through, while the men left behind call it treason.
  challenge: Turning a desperate errand into a voyage across a continent, and answering for it afterwards.
  moments:
    - text: 26 December 1541. The boat party leaves Gonzalo Pizarro’s camp on the Coca to find food and never returns.
      sources: [rah-gonzalo-pizarro, carvajal-medina-1894]
    - text: Spring 1542. In Aparia’s lands the men forge nails and build a second brigantine for the voyage ahead.
      sources: [rah-orellana]
    - text: 26 August 1542. The two brigantines leave the river mouth for the open Atlantic.
      sources: [rah-orellana, rah-carvajal]
  theme: Survival, and who gets to call a journey a discovery.

