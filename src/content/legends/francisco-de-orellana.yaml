tagline: Sent downstream to find food, he followed the river all the way to the Atlantic.
hook: >-
  Early in 1542 Orellana’s men were drifting down an unknown river in a makeshift boat and stolen
  canoes. The current was too strong to row back, and the jungle too thick to walk. Their friar
  wrote that they ate nothing but leather, belts and shoe soles boiled with herbs. The only way left
  was onward, wherever the river led.
mainAchievement: Led the first recorded European descent of most of the Amazon, 1541–1542
portrait: portrait

chapters:
  - key: beginning
    title: The Beginning
    body: >-
      Orellana came from Trujillo, in Extremadura, the home town of the Pizarro brothers, to whom he
      was related. He crossed to the Americas young and fought in the conquest of Peru, where he lost
      an eye. He stayed loyal to the Pizarros in their civil wars. In 1538 he refounded the city of
      Santiago de Guayaquil and governed it. A report to the Crown in 1541 praised him as a great warrior, conqueror
      and good governor.
    sources: [rah-orellana, pares-orellana-meritos-1541]
    status: verified
  - key: challenge
    title: The Challenge
    body: >-
      In 1541 Gonzalo Pizarro, the new governor of Quito, led an expedition east over the Andes in
      search of El Dorado and the Land of Cinnamon. Orellana joined it with men he paid for himself,
      spending more than 40,000 gold pesos. The march brought cold, earthquakes, thick forest and
      hunger. The cinnamon trees they found were worthless as a trade. At the Coca river the starving
      company built a small brigantine, the San Pedro.
    sources: [rah-orellana, rah-gonzalo-pizarro]
    status: verified
  - key: odds
    title: Against the Odds
    body: >-
      On 26 December 1541 Orellana took the brigantine and some canoes downstream with fifty-seven
      men to look for food, meaning to come back. The swollen current carried them twenty to twenty-five
      leagues a day. For two hundred leagues they found no food, and they boiled leather to eat. Rowing back
      upstream was impossible. So they agreed to go on, and Orellana gave up the authority Pizarro had
      given him and was elected their captain.
    sources: [carvajal-medina-1894, rah-orellana, rah-gonzalo-pizarro]
    status: verified
  - key: moment
    title: The Defining Moment
    body: >-
      Downriver, in the lands of a chief called Aparia, they forged nails and built a second, sturdier
      brigantine. Then came months of fighting along heavily populated banks, past the mouths of the
      Negro and the Madeira. The friar Gaspar de Carvajal, who chronicled the journey, lost an eye to
      an arrow. On 26 August 1542 the two boats left the river mouth for the Atlantic. Eleven men had
      died.
    sources: [rah-orellana, rah-carvajal, carvajal-medina-1894]
    status: verified
  - key: legacy
    title: The Legacy
    body: >-
      Orellana sailed to Spain and in February 1544 was named governor and captain-general of
      “Nueva Andalucía”, the lands along the river. His second expedition was a disaster. About
      400 men left Sanlúcar, and nearly a hundred died at Cape Verde alone. Orellana died around 1546
      near the river. The voyage put the river on European maps, and it soon came to be called the
      Amazon.
    more: >-
      Carvajal’s “Relación” is the first written description of life along the river. It records
      villages, food, trade and warfare. For centuries readers dismissed it as exaggerated. Today
      archaeologists working near Manaus and across southern Amazonia find widespread evidence of
      large pre-Columbian settlements, which makes his picture of busy riverbanks much more plausible.
      The name “Amazonas” came from Carvajal’s story of a battle in which, he says, women fought at
      the head of the warriors. It won out over “Orellana’s river” and other names.
    sources:
      [pares-orellana-provision-1544, guzman-relation, rah-orellana, uea-da-silva, de-souza-2018]
    status: verified

facts:
  - value: 56–57
    label: Men who went downstream with Orellana
    explanation: >-
      Carvajal’s own count is fifty-seven. The Real Academia de la Historia’s entry on Orellana gives
      fifty-six, and its list of names also mentions two unnamed Black men who served on the voyage.
    sources: [carvajal-medina-1894, rah-orellana, rah-carvajal]
    status: disputed
  - value: 26 Dec 1541
    label: Leaves Gonzalo Pizarro’s camp
    explanation: The boat party sets off down the Coca to look for food.
    sources: [rah-gonzalo-pizarro, rah-carvajal]
    status: verified
  - value: 26 Aug 1542
    label: Reaches the Atlantic
    explanation: The two brigantines leave the river mouth, with Marajó island to the south.
    sources: [rah-orellana, rah-carvajal]
    status: verified
  - value: '11'
    label: Men lost on the river
    explanation: The deaths the Real Academia de la Historia counts during the crossing of the continent.
    sources: [rah-orellana]
    status: verified
  - value: '400'
    label: Men on the second expedition
    explanation: >-
      A survivor reported that about 400 sailed from Sanlúcar on 11 May, that ninety-eight died at
      Cape Verde, and that fifty-seven more died at the river while building a boat.
    sources: [guzman-relation]
    status: verified

myths:
  - claim: Orellana discovered the Amazon.
    status: legend
    explanation: >-
      Millions of Indigenous people already lived along the river and knew it well. Even in Europe,
      its mouth was known before 1541: Diego Ribero’s 1529 map names it the Marañón. What Orellana’s
      party achieved was the first recorded European journey down most of its length.
    sources: [rah-orellana, de-souza-2018]
  - claim: Orellana deliberately betrayed Gonzalo Pizarro.
    status: disputed
    explanation: >-
      Pizarro wrote to the emperor in 1542 accusing Orellana of treason and of leaving the main
      party to starve. Carvajal says the current made it impossible to go back. Historians still
      disagree. The legal break, when Orellana gave up Pizarro’s commission and was elected captain,
      is what some count as betrayal.
    sources: [rah-gonzalo-pizarro, carvajal-medina-1894, rah-orellana]

otherSide:
  body: >-
    The river had owners. The peoples living along it, such as those under the chiefs Aparia,
    Machiparo and Paguana, met the expedition with gifts and food in some places and with war in
    others. The expedition’s record describes the Spaniards seizing villages to take food when they were starving,
    and holding a ceremony of “taking possession” of the land in the king’s name. Gonzalo Pizarro’s
    expedition had brought thousands of Indigenous porters and enslaved Africans,
    and two Black men, whose names were not recorded, served on Orellana’s boats. Later readers
    dismissed what Carvajal said about crowded riverbanks, but archaeology now supports it. European
    diseases cut these populations sharply in the following century. The second expedition aimed at
    conquest and settlement and cost hundreds of lives.
  sources:
    [
      rah-orellana,
      rah-gonzalo-pizarro,
      carvajal-medina-1894,
      uea-da-silva,
      de-souza-2018,
      guzman-relation,
    ]

